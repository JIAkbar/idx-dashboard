name: Update IDX Dashboard

on:
  # IDX merilis statistik harian pukul 18.00-20.00 WIB. Jadwal lama 13:00 UTC
  # = 20:00 WIB, tepat di UJUNG jendela itu: kalau rilisnya telat sedikit,
  # panen menembak berkas yang belum ada dan harinya hilang tanpa ada yang
  # menyadari sampai kalendernya terlihat bolong.
  #
  # Tiga percobaan, semuanya SESUDAH jendela rilis: 21:00, 23:00, dan 01:00 WIB
  # (hari berikutnya). Percobaan kedua & ketiga murah — kalau tanggalnya sudah
  # masuk, pemanen melewatinya. Yang mahal justru satu percobaan yang meleset.
  # JADWAL DIMATIKAN 27 Agu 2026 (Johan: "kenapa sering gagal workflow nya")
  # — runner awan GitHub SELALU ditolak idx.co.id dengan HTTP 403 (blokir
  # per-IP datacenter; terbukti di run 33006963545 dkk, sementara seluruh
  # workflow *-rumah.yml sukses). Jalur resmi: runner rumahan + Task
  # Scheduler "PAPAN-BukaLaptop" (JALANKAN_BUKA_LAPTOP.bat). Workflow ini
  # disisakan untuk pemicu manual saja, kalau suatu saat IP awan lolos.
  # schedule:
  #   - cron: '0 14 * * 1-5'   # 21:00 WIB
  #   - cron: '0 16 * * 1-5'   # 23:00 WIB
  #   - cron: '0 18 * * 1-5'   # 01:00 WIB hari berikutnya
  # Bisa dijalankan manual dari tab Actions di GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies
      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          # Playwright TIDAK dipasang di sini. download_idx.py membuangnya
          # (be02bb01) dan tak ada satu pun skrip yang dijalankan workflow ini
          # memakainya; yang masih butuh (cek_broker_summary, fetch_investor_map)
          # jalan dari mesin rumahan. Memasangnya berarti mengunduh peramban
          # ratusan MB tiap run untuk pekerjaan yang tak menyentuhnya.

      # 4. Download PDF IDX (harian + mingguan + bulanan Equity)
      #    CATATAN blokir (Agustus 2026): IDX kerap menolak/melambatkan IP
      #    datacenter GitHub — download_idx.py sekarang exit!=0 kalau scrape
      #    gagal total, jadi run ini MERAH saat diblokir (bukan sukses semu
      #    seperti dulu waktu pakai continue-on-error). Bursa libur = script
      #    exit 0 dengan "tidak ada file cocok", tidak menggagalkan run.
      #    Jalur cadangan saat diblokir: JALANKAN_OTOMATIS.bat di PC lokal.
      - name: Download IDX Statistics PDF
        run: |
          python scripts/download_idx.py --hari-ini --jenis semua

      # 5. Parse semua PDF baru → JSON (harian + mingguan + bulanan)
      #    if: always() — harus tetap jalan walau step 4 gagal (bursa mungkin
      #    tetap merilis mingguan/bulanan walau harian diblokir sebagian).
      - name: Parse PDF ke JSON
        if: always()
        run: |
          python scripts/parse_idx_pdf.py --semua
          python scripts/parse_idx_weekly.py --semua
          python scripts/parse_idx_monthly.py --semua

      # 5b. Cadangan IHSG dari Yahoo ^JKSE (B28) — kalau step 4 diblokir total,
      #     index.json/ds_<hari-ini>.json tak pernah lahir dan Kalender Bursa
      #     macet di "Tanpa data" sampai ada yang panen manual. Skrip ini
      #     CUMA mengisi entri yang IDX-nya belum ada (ditandai sumber:"yahoo",
      #     lihat panen_ihsg.py) — tak pernah menimpa PDF resmi. Run tetap
      #     MERAH kalau step 4 gagal (sinyal blokir dipertahankan); ini hanya
      #     memastikan datanya tetap terisi sambil menunggu perbaikan.
      - name: Cadangan IHSG (Yahoo ^JKSE)
        if: always()
        run: |
          python scripts/panen_ihsg.py

      # 6. Commit & push jika ada perubahan
      - name: Commit & push data baru
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-idx/json/
          # Cek apakah ada perubahan
          if git diff --staged --quiet; then
            echo "Tidak ada data baru hari ini (mungkin bursa libur)."
          else
            TODAY=$(date +'%Y-%m-%d')
            git commit -m "📊 Update data IDX: $TODAY"
            git push
            echo "Data berhasil diupdate dan di-push!"
          fi
