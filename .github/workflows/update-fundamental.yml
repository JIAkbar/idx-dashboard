name: Update Data Fundamental Saham

on:
  # Otomatis: tiap Jumat 06:00 WIB (= Jumat 23:00 UTC).
  #
  # Dulu bulanan (`0 23 28-31 * *`), dan iramanya itulah yang membuat blok
  # fundamental terbaca "membeku": terukur 9 Sep 2026, 958 dari 966 berkas
  # berstempel 1 September — bukan karena panennya gagal (run 31 Agu sukses
  # 958/967), tapi karena jendela berikutnya memang 28 hari lagi. Selama
  # jendela itu, tiap halaman yang memajang rasio menyebut tanggal yang
  # makin tua tanpa ada yang salah.
  #
  # Mingguan, bukan harian: isinya laporan keuangan yang berubah per
  # kuartal, dan menariknya tiap hari membakar kuota yang dibutuhkan panen
  # harga. Ruas berbasis HARGA sudah disegarkan tiap hari oleh
  # `segarkan_harga_fundamental.py` di pipa panen sore — jadi yang menua
  # di sini hanya angka yang memang bergerak lambat.
  schedule:
    - cron: '0 23 * * 5'      # tiap Jumat, 06:00 WIB Sabtu

  # Manual: bisa dijalankan kapan saja dari tab Actions di GitHub
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode fetch: "ihsg" = semua 959 saham IDX, "semua" = ~50 saham default'
        required: false
        default: 'ihsg'

permissions:
  contents: write

jobs:
  fetch-fundamental:
    runs-on: ubuntu-latest
    timeout-minutes: 60        # Batas waktu 60 menit (959 saham ~30 menit)

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install Python packages
        run: |
          pip install -r requirements.txt pandas openpyxl --quiet

      # 4. Jalankan fetch — argumen: --ihsg (959 saham) atau --semua (default ~50)
      - name: Fetch data fundamental IDX
        run: |
          MODE="${{ github.event.inputs.mode || 'ihsg' }}"
          echo "Mode: $MODE"
          python scripts/fetch_fundamental.py --$MODE
        continue-on-error: false

      # 4b. Tambal ruas yang yfinance tak punya (eps/pe/der/roe/hist_eps/
      #     f_score) dari ruas lain di berkas yang sama + laporan resmi bursa.
      #     WAJIB sesudah langkah 4: fetch menulis ulang tiap berkas dari nol,
      #     jadi tambalan lama ikut terhapus dan harus dihitung ulang di sini.
      #     Nol permintaan jaringan — seluruh bahannya sudah ada di repo.
      - name: Lengkapi ruas fundamental turunan
        run: python scripts/lengkapi_fundamental.py
        continue-on-error: false

      # 5. Commit & push jika ada perubahan JSON
      - name: Commit & push data fundamental
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-idx/json/fundamental/
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data — skip commit."
          else
            TODAY=$(date +'%Y-%m-%d')
            COUNT=$(git diff --staged --name-only | wc -l)
            git commit -m "📊 Update fundamental: $TODAY ($COUNT file)"
            # TANPA tarik-lalu-rebase (#163 di CI, ralat 12 Sep 2026) - konflik pada
            # berkas hasil generasi tak layak digabung tangan. Versi kita menang untuk
            # data yang baru dibangun; konflik DI LUAR data-idx MENGHENTIKAN langkah.
            git push origin HEAD:main || {
              echo "push ditolak - menggabung dengan remote"
              git fetch origin main
              if ! git merge --no-edit origin/main; then
                BENTROK=$(git diff --name-only --diff-filter=U)
                LUAR=$(printf '%s\n' "$BENTROK" | grep -v '^data-idx/' | grep -v '^$' || true)
                if [ -n "$LUAR" ]; then
                  echo "::error::konflik DI LUAR data-idx: $LUAR - berhenti, dokumen manusia tak disentuh"
                  git merge --abort
                  exit 1
                fi
                git checkout --ours -- $BENTROK && git add $BENTROK && git commit --no-edit
              fi
              git push origin HEAD:main || { echo "::error::push masih ditolak sesudah gabung"; exit 1; }
            }
            echo "✅ Push berhasil: $COUNT file diperbarui."
          fi
