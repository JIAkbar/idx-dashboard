# Panen kabar dari RUNNER RUMAHAN — khusus sumber yang ditolak IP datacenter.
#
# Kenapa berkas ini ada, terukur pada 20 Agustus 2026:
#
#   investasi.kontan.co.id/rss                 200 dari rumah · 403 dari runner GitHub
#   idx.co.id/.../GetNewsSearch                200 dari rumah · 403 dari runner GitHub
#
# Dan akibatnya di `kabar.json` pada hari yang sama: IPOT News terbaru 20 Agu
# 07:17, sementara IDX dan Kontan berhenti di 18 Agu 21:56. Alur awan HIJAU
# tiap 2 jam sambil tiga dari lima sumber pulang kosong — kegagalan yang tak
# pernah berbunyi.
#
# Yang membedakan bukan bentuk permintaannya. `panen_kabar.py` SUDAH memakai
# `idx_net` (curl_cffi, sidik jari TLS peramban) dan `curl_cffi` sudah ada di
# `requirements.txt` maupun di langkah pasang alur awan. Sudah diuji, tetap
# 403. Yang tersisa cuma alamat IP-nya, dan itu tak bisa ditambal dari kode.
#
# HIBRIDA, atas keputusan Johan 20 Agu 2026 — bukan pemindahan:
#
#   panen-kabar.yml       (ubuntu-latest) → IPOT + Snips, tiap 2 jam, TETAP
#   panen-kabar-rumah.yml (self-hosted)   → IDX berita, IDX pengumuman, Kontan
#
# Alasan pembagiannya: kalau PC rumah mati, separuh yang memang tembus dari
# awan tetap jalan. Sebaliknya kalau IDX kelak membuka IP datacenter, alur
# awan sudah mencobanya tiap 2 jam dan akan mencatatnya sendiri di
# `kabar-sumber-awan.json` — jadi jalur ini bisa dipensiunkan berdasar bukti,
# bukan tebakan.
#
# Aman berdampingan: `panen_kabar.py` MENGGABUNG dengan isi berkas yang ada dan
# membuang duplikat lewat tautan + judul + waktu, jadi dua jalur tak saling
# menimpa. `concurrency` di bawah memakai grup yang SAMA dengan alur awan
# supaya keduanya tak berebut commit ke berkas yang sama.

name: Panen kabar (runner rumahan)

on:
  schedule:
    # HANYA jendela laptop Johan menyala: 18:00–20:00 WIB (11–13 UTC).
    # Johan 29 Agu 2026: "saya buka laptop di antara pukul 18.00-20.00".
    #
    # Dulu tujuh slot 08:00–20:00 WIB, dan LIMA di antaranya hilang tiap hari
    # karena runner offline. Tiga slot yang benar-benar jalan menaikkan
    # cakupan nyata dibanding tujuh slot yang lima-nya lenyap diam-diam.
    #
    # MENIT 15, bukan menit 0: alur awan kini jalan tiap 2 jam di MENIT 0
    # (termasuk 12 UTC yang jatuh di dalam jendela ini), dan `panen-harian-rumah`
    # memakai menit 30. Tiga alur, tiga menit berbeda — tak ada yang saling
    # menunggu di `concurrency` lalu kedaluwarsa tanpa memanen apa pun.
    - cron: '15 11,12,13 * * 1-6'   # 18:15 · 19:15 · 20:15 WIB
  workflow_dispatch:
    inputs:
      sumber:
        description: >-
          Sumber yang dipanen (pisahkan koma). Kosongkan untuk ketiganya.
          Pilihan: idx, idx-pengumuman, kontan
        required: false
        default: ''

env:
  # Akar arsip mentah, DI LUAR ruang kerja runner (#165 B2, 10 Sep 2026).
  #
  # Tiga alur self-hosted berbagi SATU ruang kerja, dan tiap
  # `actions/checkout@v4` menjalankan `git clean -ffdx` yang ikut menghapus
  # berkas ter-gitignore. Log jalan 34368692222 baris 56 menuliskannya
  # harfiah: `Removing _arsip-mentah/`. Akibatnya arsip yang ditulis langkah
  # panen pukul 22:38 disapu alur berikutnya pukul 23:48 — dan yang mahal
  # justru MENGAMBILNYA (IDX menolak kalau digedor, IPOT cuma dari IP
  # rumahan). Arsip mentah bukan keadaan ruang kerja; ia singgahan cakram.
  #
  # Yang ditunjuk JALUR, bukan data. Bawaan `arsip_mentah.py` TIDAK berubah:
  # tanpa variabel ini akarnya tetap `<akar repo>/_arsip-mentah`, jadi laptop
  # Johan dan skrip yang dijalankan tangan nol perubahan perilaku.
  #
  # Folder ini MULAI KOSONG dan terisi sendiri — nol arsip lama dipindahkan
  # atau dihapus. Jalan pertama sesudah ini menarik ulang sekali, lalu
  # seterusnya membaca dari cakram.
  #
  # RALAT 12 Sep 2026 (#172 D): akarnya semula `C:\papan-arsip` - folder baru
  # yang memenuhi syarat "di luar ruang kerja runner" tapi LAHIR 11 Sep dan tak
  # punya riwayat apa pun. Akibatnya terukur di produksi: `broker_tahunan`
  # dibangun dari arsip kosong, dan pada commit dc8c2d896 (jalan CI 11 Sep
  # 08:34) **832 dari 881 berkas miskin** - BBCA tinggal 4.872 byte dari
  # 845.439. Laptop memulihkannya tiap sore tanpa ada yang tahu sebabnya, jadi
  # produksi bolak-balik antara penuh dan miskin selama ~1,5 hari.
  #
  # Dua akar itu tidak setara: 10 sumber lawan 26, dan `broker-harian/BBCA`
  # 12 berkas lawan 25.057.
  #
  # Akar laptop memenuhi KEDUA syarat: ia di pohon kerja Johan, BUKAN di
  # `C:\actions-runner\_work\...`, jadi `git clean -ffdx` runner tak pernah
  # menyentuhnya - yang #165 B2 perbaiki tetap terjaga - DAN ia memuat riwayat
  # penuh. Nol berkas dipindahkan; cuma nilai variabel ini yang berubah.
  #
  # Karena akarnya kini dipakai bersama bat sore (18:00, berjam-jam) sementara
  # alur CI mulai 18:15/18:30/19:30, `arsip_mentah.simpan()` dibuat ATOMIK
  # (tulis sementara + os.replace) dan menolak menimpa arsip berisi dengan
  # potret yang menyusut drastis. Lihat #172 D1 dan D2.
  PAPAN_ARSIP_AKAR: 'C:\1-Johan\10. Pengembangan\IDX Statistik\_arsip-mentah'

  # Runner rumahan memakai konsol Windows ber-encoding lama: satu karakter
  # non-ASCII di baris cetak membunuh skrip Python sebelum ia bekerja.
  # `panen-harian-rumah.yml` sudah menyetelnya sejak awal; dua alur
  # self-hosted lain tertinggal sampai 12 Sep 2026.
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

concurrency:
  group: panen-kabar
  cancel-in-progress: false

jobs:
  panen:
    runs-on: self-hosted
    # Runner rumahan tak boleh menggantung selamanya kalau jaringannya putus.
    timeout-minutes: 20
    defaults:
      run:
        # PowerShell, BUKAN bash — dan itu keputusan sesudah dua kegagalan
        # berturut-turut, bukan selera:
        #
        # 1. `shell: bash` menunjuk `C:\WINDOWS\system32\bash.EXE` = bash WSL.
        #    Layanan runner berjalan sebagai LocalSystem, dan WSL menolaknya:
        #    "Running WSL as local system is not supported."
        #
        # 2. Menyebut Git Bash dengan jalur penuh juga ditolak runner:
        #    "Second path fragment must not be a drive or UNC name." — jalur
        #    shell kustom tak boleh mengandung spasi seperti "Program Files".
        #
        # PowerShell selalu ada di Windows, tak butuh jalur kustom, dan tak
        # bergantung pada WSL maupun Git for Windows. Kelas masalahnya hilang,
        # bukan diakali.
        # PowerShell + `-ExecutionPolicy Bypass` — bypass-nya WAJIB, bukan
        # kehati-hatian: sejak 18 Agu 2026 SETIAP langkah di runner rumahan
        # gagal `PSSecurityException: running scripts is disabled on this
        # system` (Execution Policy mesin = Restricted/AllSigned). Panennya
        # sendiri jalan, tapi langkah "Commit kalau ada perubahan" ikut gagal,
        # jadi hasil panen tak pernah masuk repo dan produksi membeku di 18
        # Agu tanpa satu pun galat yang terbaca dari halaman (Johan 21 Agu:
        # "beritanya bnyk yang basi nih, di github pun gak bisa jalan tuh").
        # Bypass di baris perintah hanya berlaku untuk proses itu — setelan
        # keamanan mesin TIDAK diubah.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - uses: actions/checkout@v4

      # Python DISEBUT eksplisit, tidak lewat PATH. Di mesin ini `python` di
      # PATH menunjuk venv lain yang tak punya `curl_cffi`, dan gejalanya
      # menyesatkan: terbaca seperti dependensi proyek yang hilang padahal
      # `requirements.txt` sudah memuatnya dan lingkungan yang benar sudah
      # terpasang. Layanan runner juga memakai PATH-nya sendiri, yang belum
      # tentu sama dengan PATH shell Johan.
      - name: Tentukan Python
        id: py
        run: |
          $kandidat = @('C:\Python314\python.exe', 'python3', 'python')
          foreach ($p in $kandidat) {
            $exe = (Get-Command $p -ErrorAction SilentlyContinue).Source
            if (-not $exe) { continue }
            & $exe -c "import curl_cffi" 2>$null
            if ($LASTEXITCODE -eq 0) {
              "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Host "Python: $exe"
              exit 0
            }
          }
          Write-Host "::error::Tak ada Python yang punya curl_cffi. Pasang: C:\Python314\python.exe -m pip install curl_cffi requests"
          exit 1

      # `continue-on-error` DIBATASI ke langkah panen saja, dan alasannya
      # sempit: satu sumber mati tak boleh menghentikan sumber lain. Ia BUKAN
      # jaring pengaman untuk kegagalan lingkungan — 20 Agu 2026 justru itu
      # yang terjadi: shell tak bisa dijalankan, seluruh langkah tak pernah
      # berjalan, dan `continue-on-error` menelannya sehingga job baru merah
      # jauh belakangan di langkah commit dengan log penuh langkah "sukses".
      - name: Panen IDX + Kontan
        continue-on-error: true
        run: |
          $sumber = "${{ github.event.inputs.sumber }}"
          if (-not $sumber) { $sumber = 'idx,idx-pengumuman,kontan' }
          & "${{ steps.py.outputs.exe }}" scripts/panen_kabar.py --batas 30 `
            --status "$env:RUNNER_TEMP\status-kabar.jsonl" --hanya $sumber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Vonis merah/hijau diputuskan SATU tempat, sama seperti alur awan.
      - name: Periksa hasil & kesegaran
        continue-on-error: true
        run: |
          & "${{ steps.py.outputs.exe }}" scripts/cek_kabar.py `
            --status "$env:RUNNER_TEMP\status-kabar.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit kalau ada perubahan
        if: always()
        run: |
          $berkas = 'data-idx/json/kabar.json'
          git diff --quiet -- $berkas
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Tidak ada perubahan — tidak commit.'
            exit 0
          }
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $berkas
          $stempel = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          git commit -m "data: panen kabar rumahan $stempel UTC"

          # TANPA tarik-lalu-rebase (#163 di CI, ralat 12 Sep 2026). Baris itu
          # dulu di sini, dan kembarannya di `panen-kabar.yml` GAGAL dua kali
          # (10 Sep 22:47 dan 12 Sep 00:39 UTC) dengan
          #   CONFLICT (content): Merge conflict in data-idx/json/kabar.json
          # sehingga commit berisi 190 item tak pernah mendarat. Alur INI belum
          # pernah gagal, tapi itu karena jadwalnya jarang - bukan karena ia
          # kebal; barisnya sama persis.
          #
          # Konflik pada berkas HASIL GENERASI tak layak digabung tangan:
          # `kabar.json` keluaran pemanen atas apa pun yang ada di cakram. Jadi
          # jawabannya bukan "gabungkan dua versi" melainkan "bangun ulang di
          # atas versi remote terbaru" - pola yang sama dengan
          # `scripts/panen_kabar.ps1`, yang sudah terbukti sejak 10 Sep.
          $sukses = $false
          foreach ($percobaan in 1..2) {
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -eq 0) { $sukses = $true; break }
            Write-Host "push ditolak - remote maju di tengah jalan (percobaan $percobaan)"

            # Commit sendiri dilepas supaya percobaan berikutnya benar-benar
            # mulai dari remote. Dijaga ketat: hanya kalau commit teratas
            # MEMANG milik alur ini.
            $judul = (git log -1 --format='%s')
            if ($judul -notlike "data: panen kabar rumahan *") {
              Write-Host "::error::commit teratas bukan milik alur ini ($judul) - tidak dilepas"
              exit 1
            }
            git reset --soft HEAD~1
            git restore --staged $berkas 2>$null

            git fetch origin $env:GITHUB_REF_NAME
            git merge --ff-only "origin/$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::maju-cepat ke remote gagal - berhenti tanpa menimpa apa pun"
              exit 1
            }
            git checkout "origin/$env:GITHUB_REF_NAME" -- $berkas

            & "${{ steps.py.outputs.exe }}" scripts/panen_kabar.py --batas 30 `
              --status "$env:RUNNER_TEMP\status-kabar.jsonl"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::panen ulang gagal - berhenti, berkas remote tak disentuh"
              exit 1
            }
            git diff --quiet -- $berkas
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'Daftar sama dengan remote sesudah dibangun ulang - tidak commit.'
              exit 0
            }
            git add $berkas
            $stempel = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
            git commit -m "data: panen kabar rumahan $stempel UTC"
          }
          if (-not $sukses) {
            Write-Host "::error::dua percobaan push gagal - berhenti tanpa menimpa apa pun"
            exit 1
          }

      # Runner rumahan TIDAK memulai dari mesin bersih seperti runner GitHub:
      # sisa berkas satu jalan akan terbawa ke jalan berikutnya dan bisa
      # membuat `git diff` di atas salah baca.
      - name: Bersihkan sisa
        if: always()
        run: |
          git clean -fdq -- data-idx
          exit 0
