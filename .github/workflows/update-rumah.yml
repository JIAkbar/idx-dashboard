# Statistik harian IDX dari RUNNER RUMAHAN — pasangan `update.yml`.
#
# Terukur 20 Agustus 2026, dan ini bukan dugaan:
#
#   * `update.yml` (ubuntu-latest) MERAH 13, 14, 17, 18, 19, 20 Agu — IDX
#     menolak IP runner GitHub. Hijau 10–12 Agu, jadi blokirnya kumat-kumatan,
#     bukan permanen.
#   * PDF 19 Agustus diunduh dari IP rumahan sekali coba, 1.940 KB, tanpa
#     akal-akalan. Kalender Bursa yang berbunyi "Tanpa data" langsung terisi.
#
# Yang membedakan alamat IP-nya, bukan bentuk permintaannya: `download_idx.py`
# sudah memakai `idx_net` (curl_cffi, sidik jari TLS peramban) dan tetap 403
# dari awan. Tak ada perubahan kode yang bisa menambalnya.
#
# HIBRIDA, pola yang sama dengan `panen-kabar-rumah.yml`:
#
#   update.yml        (ubuntu-latest) → tetap mencoba tiap hari
#   update-rumah.yml  (self-hosted)   → yang benar-benar memanen
#
# Alur awan sengaja TIDAK dimatikan. Ia murah, dan ia satu-satunya cara kita
# tahu kalau IDX kelak membuka IP datacenter lagi — kalau ia berubah hijau
# berhari-hari, jalur rumahan boleh dipensiunkan berdasar bukti, bukan tebakan.
# Merahnya juga tetap berguna sebagai sinyal blokir; jangan diredam.

name: Statistik harian IDX (runner rumahan)

on:
  schedule:
    # Dipindah ke jendela laptop Johan (18:00–20:00 WIB) — 29 Agu 2026.
    # Sebelumnya 22:00 dan 02:00 WIB: DUA-DUANYA di luar jendela, jadi alur
    # ini praktis tak pernah jalan terjadwal. Statistik harian IDX cuma masuk
    # lewat tugas login `PAPAN-BukaLaptop`, dan itu kebetulan, bukan jadwal.
    #
    # Ditaruh di UJUNG AKHIR jendela, bukan awal: IDX merilis statistiknya
    # 18:00–20:00 WIB, jadi memanen pukul 18:00 berisiko menembak berkas yang
    # belum terbit. Percobaan kedua 30 menit kemudian murah — tanggal yang
    # sudah ada dilewati tanpa mengunduh apa pun.
    #
    # Menit dipilih supaya tak bertabrakan: awan di menit 0 jam genap,
    # `panen-kabar-rumah` di menit 15. 12:30 UTC jam genap tapi menit 30 (aman),
    # 13:00 UTC jam ganjil (aman).
    - cron: '30 12 * * 1-5'   # 19:30 WIB — sesudah sebagian besar rilis
    - cron: '0 13 * * 1-5'    # 20:00 WIB — percobaan kedua
  workflow_dispatch:

env:
  # Akar arsip mentah, DI LUAR ruang kerja runner (#165 B2, 10 Sep 2026).
  #
  # Tiga alur self-hosted berbagi SATU ruang kerja, dan tiap
  # `actions/checkout@v4` menjalankan `git clean -ffdx` yang ikut menghapus
  # berkas ter-gitignore. Log jalan 34368692222 baris 56 menuliskannya
  # harfiah: `Removing _arsip-mentah/`. Akibatnya arsip yang ditulis langkah
  # panen pukul 22:38 disapu alur berikutnya pukul 23:48 — dan yang mahal
  # justru MENGAMBILNYA (IDX menolak kalau digedor, IPOT cuma dari IP
  # rumahan). Arsip mentah bukan keadaan ruang kerja; ia singgahan cakram.
  #
  # Yang ditunjuk JALUR, bukan data. Bawaan `arsip_mentah.py` TIDAK berubah:
  # tanpa variabel ini akarnya tetap `<akar repo>/_arsip-mentah`, jadi laptop
  # Johan dan skrip yang dijalankan tangan nol perubahan perilaku.
  #
  # Folder ini MULAI KOSONG dan terisi sendiri — nol arsip lama dipindahkan
  # atau dihapus. Jalan pertama sesudah ini menarik ulang sekali, lalu
  # seterusnya membaca dari cakram.
  PAPAN_ARSIP_AKAR: 'C:\papan-arsip'

permissions:
  contents: write

concurrency:
  # Grup SAMA dengan alur awan — keduanya menulis `data-idx/json/ds_*.json`.
  group: update-idx
  cancel-in-progress: false

jobs:
  panen:
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        # PowerShell, BUKAN bash — sesudah dua kegagalan di alur kabar:
        # `shell: bash` menunjuk bash WSL (ditolak karena layanan runner
        # berjalan sebagai LocalSystem), dan menyebut Git Bash dengan jalur
        # penuh ditolak runner karena mengandung spasi ("Program Files").
        # PowerShell + `-ExecutionPolicy Bypass` — bypass-nya WAJIB, bukan
        # kehati-hatian: sejak 18 Agu 2026 SETIAP langkah di runner rumahan
        # gagal `PSSecurityException: running scripts is disabled on this
        # system` (Execution Policy mesin = Restricted/AllSigned). Panennya
        # sendiri jalan, tapi langkah "Commit kalau ada perubahan" ikut gagal,
        # jadi hasil panen tak pernah masuk repo dan produksi membeku di 18
        # Agu tanpa satu pun galat yang terbaca dari halaman (Johan 21 Agu:
        # "beritanya bnyk yang basi nih, di github pun gak bisa jalan tuh").
        # Bypass di baris perintah hanya berlaku untuk proses itu — setelan
        # keamanan mesin TIDAK diubah.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - uses: actions/checkout@v4

      # Python disebut eksplisit: `python` di PATH mesin ini menunjuk venv lain
      # yang tak punya `curl_cffi`, dan layanan runner memakai PATH-nya sendiri
      # yang belum tentu sama dengan PATH shell Johan.
      - name: Tentukan Python
        id: py
        run: |
          $kandidat = @('C:\Python314\python.exe', 'python3', 'python')
          foreach ($p in $kandidat) {
            $exe = (Get-Command $p -ErrorAction SilentlyContinue).Source
            if (-not $exe) { continue }
            & $exe -c "import curl_cffi" 2>$null
            if ($LASTEXITCODE -eq 0) {
              "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Host "Python: $exe"
              exit 0
            }
          }
          Write-Host "::error::Tak ada Python yang punya curl_cffi. Pasang: C:\Python314\python.exe -m pip install curl_cffi requests"
          exit 1

      - name: Unduh PDF statistik IDX
        run: |
          & "${{ steps.py.outputs.exe }}" scripts/download_idx.py --hari-ini --jenis semua
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Susulan bulan berjalan. PDF IDX kadang terbit SESUDAH runner
          # jalan: 31 Agu 2026 dijalankan 19.11 dan 19.16, PDF-nya belum
          # ada, dan --hari-ini tak pernah menengok ke belakang - hari itu
          # tersimpan sebagai potret Yahoo 12 kunci selama seminggu tanpa
          # satu pun galat. Menyapu bulan berjalan murah: download_idx.py
          # melewati berkas yang sudah ada (>10 KB) dan mencetak [SKIP],
          # jadi yang benar-benar diunduh cuma hari yang memang bolong.
          $kini = Get-Date
          & "${{ steps.py.outputs.exe }}" scripts/download_idx.py --bulan $kini.Month --tahun $kini.Year --jenis harian
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Parse WAJIB memakai jalur MUTLAK. Jalur relatif membuat skripnya
      # menjawab "SKIP" tanpa satu pun galat — PDF-nya turun, JSON-nya tak
      # pernah dibuat, dan Kalender Bursa tetap berbunyi "Tanpa data".
      # Terjadi 20 Agu 2026 saat menambal 19 Agustus dengan tangan.
      # Pemilihan berkas memakai NAMA, bukan waktu tulis (#127, 8 Sep 2026).
      # Runner membuang PDF (`git clean` di akhir tiap run), jadi tiap run
      # mengunduh ULANG seluruh bulan: hari ini turun lebih dulu, tanggal
      # 01-07 menyusul sesudahnya, dan `Sort LastWriteTime -Descending`
      # karena itu menaruh hari TERBARU di urutan paling belakang lalu
      # membuangnya lewat `-First 5`. Akibatnya, sejak hari bursa ke-6 tiap
      # bulan, ds hari itu tak pernah ter-parse: `git diff` kosong, langkah
      # commit menjawab "Tidak ada perubahan", run HIJAU, dan Beranda diam
      # di tanggal lama. Tanggalnya ada di NAMA berkas (ds_yymmdd), jadi
      # nama yang dipakai mengurutkan.
      - name: Parse PDF ke JSON
        run: |
          $akar = (Get-Location).Path
          $semua = Get-ChildItem "$akar\data-idx\daily" -Filter 'ds_*.pdf' -ErrorAction SilentlyContinue |
                   Sort-Object Name -Descending
          if (-not $semua) { Write-Host 'Tak ada PDF baru.'; exit 0 }
          $pdf = $semua | Select-Object -First 5
          Write-Host ('Akan di-parse: ' + (($pdf | ForEach-Object { $_.Name }) -join ', '))
          foreach ($f in $pdf) {
            & "${{ steps.py.outputs.exe }}" scripts/parse_idx_pdf.py $f.FullName
          }
          # Gerbang fail-loud (pola #102): PDF bertanggal TERBARU wajib punya
          # JSON-nya. Tanpa gerbang ini kegagalan pemilihan berkas tak punya
          # satu pun gejala yang terlihat dari luar.
          $terbaru = $semua[0]
          $json = Join-Path "$akar\data-idx\json" ($terbaru.BaseName + '.json')
          if (-not (Test-Path $json)) {
            Write-Host ('GAGAL: ' + $terbaru.Name + ' tidak menghasilkan ' + $terbaru.BaseName + '.json')
            exit 1
          }
          Write-Host ('OK: ' + $terbaru.BaseName + '.json ada')
          exit 0

      - name: Commit kalau ada perubahan
        if: always()
        run: |
          $berkas = 'data-idx/json'
          git diff --quiet -- $berkas
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Tidak ada perubahan — tidak commit.'
            exit 0
          }
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $berkas
          $stempel = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          git commit -m "data: statistik harian rumahan $stempel UTC"
          # TANPA tarik-lalu-rebase (#163 di CI, ralat 12 Sep 2026). Baris itu
          # dulu di sini; kembarannya di `panen-kabar.yml` gagal dua kali
          # (10 Sep 22:47, 12 Sep 00:39 UTC) dengan konflik pada berkas hasil
          # generasi, dan commit-nya tak pernah mendarat.
          #
          # Alur INI tak bisa memakai pola "panen ulang di atas remote" seperti
          # kabar: panennya berjam-jam, bukan sepuluh detik. Jadi: GABUNG, dan
          # untuk berkas yang baru saja dibangun dari sumber, versi kita yang
          # menang - ia memang keluaran panen atas isi cakram terbaru.
          #
          # Batasnya keras: konflik DI LUAR `data-idx/` MENGHENTIKAN langkah.
          # Mesin tak pernah menggabung dokumen manusia (pelajaran #163:
          # `stash pop` pernah menulis penanda konflik ke dalam dokumen antrean).
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "push ditolak - remote maju di tengah jalan, menggabung"
            git fetch origin $env:GITHUB_REF_NAME
            git merge --no-edit "origin/$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) {
              $bentrok = @(git diff --name-only --diff-filter=U)
              $luar = @($bentrok | Where-Object { $_ -notlike 'data-idx/*' })
              if ($luar.Count -gt 0) {
                Write-Host ("::error::konflik DI LUAR data-idx: " + ($luar -join ', ') +
                            " - berhenti, dokumen manusia tak disentuh")
                git merge --abort
                exit 1
              }
              Write-Host ("konflik hanya di data-idx (" + $bentrok.Count +
                          " berkas) - dimenangkan versi yang baru dibangun")
              git checkout --ours -- $bentrok
              git add $bentrok
              git commit --no-edit
            }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::push masih ditolak sesudah gabung - berhenti"
              exit 1
            }
          }

      # Runner rumahan tak memulai dari mesin bersih seperti runner GitHub —
      # sisa satu jalan terbawa ke jalan berikutnya dan membuat `git diff`
      # salah baca.
      - name: Bersihkan sisa
        if: always()
        run: |
          git clean -fdq -- data-idx
          exit 0
