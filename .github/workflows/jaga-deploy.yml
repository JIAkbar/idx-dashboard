# Penjaga kesegaran produksi.
#
# Lahir dari kegagalan 28 Agustus – 1 September 2026: Vercel berhenti men-deploy
# selama 3,7 hari dan TAK SEORANG PUN TAHU. Situs tetap terbuka, tetap cepat,
# tetap penuh angka — cuma angkanya beku di 27 Agustus. Actions hijau terus
# (ia memanen data & membangun Pages, tak menyentuh Vercel), commit masuk tiap
# jam, dan Vercel tak mengirim apa pun saat build gagal.
#
# Situs yang MATI langsung ketahuan. Situs yang BEKU tidak.
#
# Penjaga ini menutup seluruh kelas itu dengan satu pertanyaan yang tak bisa
# dijawab keliru: apakah tanggal data yang TAMPIL DI PRODUKSI sama dengan
# tanggal data yang ADA DI REPO? Build gagal, integrasi Git putus, kuota habis,
# cache nyangkut — semuanya bergejala sama, dan semuanya tertangkap di sini.
#
# Sengaja memeriksa PRODUKSI lewat jaringan, bukan memeriksa berkas di repo:
# yang mau dibuktikan adalah "sampai ke pengunjung", dan itu cuma bisa
# dibuktikan dengan mengambilnya seperti pengunjung. Memeriksa repo cuma akan
# mengulang kekeliruan yang membuat kegagalan ini luput — memastikan hal yang
# bersebelahan lalu menyimpulkan yang sesungguhnya.

name: Jaga Deploy

on:
  schedule:
    # 02:00 UTC = 09:00 WIB — sesudah panen malam mendarat, sebelum jam kerja.
    - cron: '0 2 * * *'
  workflow_dispatch:

# Pekerjaan `periksa` hanya membaca. `kesegaran-sumber` butuh izin menulis
# issue, dan izinnya diberikan di pekerjaan itu saja — bukan di seluruh
# alur kerja.
permissions:
  contents: read

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data-idx/json/index.json
          sparse-checkout-cone-mode: false

      - name: Bandingkan tanggal produksi dengan repo
        env:
          SITUS: https://papan-idx.vercel.app
        run: |
          set -euo pipefail

          # Tanggal terbaru menurut repo — sumber kebenarannya.
          # `dates` berisi OBJEK, bukan teks tanggal — tanggalnya di ruas
          # `date_iso`. Versi pertama penjaga ini mengasumsikan larik teks dan
          # langsung melempar TypeError; bentuk data diperiksa dulu, bukan
          # ditebak dari nama ruasnya.
          BACA='import json,sys; d=json.load(sys.stdin); print(max(x["date_iso"] for x in d["dates"]))'
          REPO=$(python3 -c "$BACA" < data-idx/json/index.json)

          # Tanggal terbaru menurut PRODUKSI. Cache-bust supaya yang diukur
          # bukan salinan tepi yang kebetulan masih hangat.
          #
          # Header ikut diambil (-D) karena sejak 2 Sep 2026 Vercel memasang
          # "Security Checkpoint": permintaan non-peramban dijawab HTTP 403
          # berisi halaman challenge, ditandai `X-Vercel-Mitigated: challenge`.
          # Tanpa membedakannya, penjaga ini melapor GAGAL tiap hari — dan
          # alarm yang menyala tiap hari adalah alarm yang diabaikan, persis
          # kekeliruan toleransi info_stockbit yang baru dibetulkan.
          #
          # "Tak bisa diukur" BUKAN "beku". Yang pertama peringatan, yang
          # kedua galat. Menyamakan keduanya membuat penjaga ini berbohong ke
          # dua arah sekaligus: menuduh beku saat cuma terhalang, dan kelak
          # diabaikan saat benar-benar beku.
          BADAN=$(curl -s --max-time 45 -D /tmp/h.txt \
            "$SITUS/data-idx/json/index.json?cb=$RANDOM" || true)
          KODE=$(awk 'NR==1{print $2}' /tmp/h.txt 2>/dev/null)

          if grep -qi '^x-vercel-mitigated:[[:space:]]*challenge' /tmp/h.txt 2>/dev/null; then
            echo "::warning::Produksi TIDAK BISA DIPERIKSA dari CI — Vercel memasang Security Checkpoint (HTTP $KODE, challenge). Ini bukan bukti situs beku dan bukan bukti situs segar; verifikasi hanya sah lewat render peramban. Matikan Attack Challenge Mode di dasbor Vercel kalau pemeriksaan otomatis ini mau dihidupkan lagi."
            exit 0
          fi

          PROD=$(printf '%s' "$BADAN" | python3 -c "$BACA" 2>/dev/null) || {
            echo "::error::Tidak bisa membaca data produksi ($SITUS, HTTP $KODE). Situsnya mati, berkas datanya tak ikut ter-deploy, atau bentuk datanya berubah."
            exit 1
          }

          echo "repo     : $REPO"
          echo "produksi : $PROD"

          if [ "$REPO" = "$PROD" ]; then
            echo "Produksi segar — tanggalnya sama."
            exit 0
          fi

          # Selisih dalam HARI KALENDER. Ambang 3 hari, bukan 1: akhir pekan
          # dan libur bursa membuat repo mendahului produksi secara sah tanpa
          # ada yang rusak. Tiga hari melewati akhir pekan terpanjang yang wajar
          # dan tetap menangkap pembekuan sungguhan jauh sebelum ia jadi minggu.
          BEDA=$(python3 -c "
          from datetime import date
          a=date.fromisoformat('$REPO'); b=date.fromisoformat('$PROD')
          print((a-b).days)
          ")
          echo "selisih  : $BEDA hari"

          if [ "$BEDA" -ge 3 ]; then
            echo "::error::PRODUKSI BEKU $BEDA hari. Repo punya $REPO, yang tayang $PROD."
            echo "::error::Deploy berhenti mendarat. Periksa dasbor Vercel: build gagal, integrasi Git terputus, atau kuota habis."
            exit 1
          fi

          echo "::warning::Produksi tertinggal $BEDA hari ($PROD vs $REPO) — masih dalam ambang akhir pekan, belum dianggap beku."

  # ---------------------------------------------------------------------
  # #80 B — kesegaran SUMBER di dalam repo.
  #
  # Penjaga di atas menjawab "apakah yang tayang sama dengan yang di repo".
  # Ia tak bisa melihat kegagalan yang membuat Johan bertanya 7 Sep 2026:
  # repo dan produksi sama-sama menunjukkan "Data per 4 September" karena
  # yang basi SUMBERNYA, bukan penyalurannya. Dua sumber yang seharusnya
  # bergerak bersama dibandingkan SATU SAMA LAIN di sini.
  #
  # Dibandingkan silang, bukan ke kalender: hari bursa punya libur yang tak
  # ada di kalender mana pun yang dipegang CI, dan penjaga yang menebak
  # kalender akan menyalak tiap libur nasional. Dua sumber yang saling
  # menyusul menghapus seluruh persoalan itu — keduanya diam di hari libur.
  kesegaran-sumber:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data-idx/json/index.json
            data-idx/json/ohlc/BBCA.json
            data-idx/json/broker_tahunan/BBCA/2026.json
            data-idx/json/broker_tahunan/BBRI/2026.json
            data-idx/json/broker_tahunan/TLKM/2026.json
          sparse-checkout-cone-mode: false

      - name: Bandingkan tanggal statistik IDX dengan tanggal harga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          DS=$(python3 -c "import json;d=json.load(open('data-idx/json/index.json'));print(max(x['date_iso'] for x in d['dates']))")
          HARGA=$(python3 -c "import json;d=json.load(open('data-idx/json/ohlc/BBCA.json'));print(d['d'][-1][0])")
          echo "statistik IDX : $DS"
          echo "harga BBCA    : $HARGA"

          if [ "$DS" = "$HARGA" ]; then
            echo "Kedua sumber sejalan."
            exit 0
          fi

          BEDA=$(python3 -c "
          from datetime import date
          a=date.fromisoformat('$HARGA'); b=date.fromisoformat('$DS')
          print(abs((a-b).days))",)
          BASI=$([ "$DS" \< "$HARGA" ] && echo "statistik IDX (ds_*.json)" || echo "harga (ohlc/)")
          echo "selisih: $BEDA hari, yang tertinggal: $BASI"

          # Satu hari masih wajar: PDF statistik terbit malam, dan panen
          # sore bisa telat beberapa jam tanpa ada yang rusak. Dua hari
          # berarti satu panen benar-benar hilang.
          if [ "$BEDA" -lt 2 ]; then
            echo "::warning::Sumber tertinggal $BEDA hari ($BASI). Masih dalam ambang keterlambatan panen sore."
            exit 0
          fi

          JUDUL="Data basi $BEDA hari: $BASI tertinggal (statistik $DS, harga $HARGA)"
          # Dedup: alarm yang membuat satu issue tiap pagi adalah alarm yang
          # ditutup tanpa dibaca.
          ADA=$(gh issue list --state open --search "Data basi in:title" --json title --jq '[.[] | select(.title | startswith("Data basi"))] | length')
          if [ "$ADA" != "0" ]; then
            echo "::warning::$JUDUL — issue serupa sudah terbuka, tak dibuat lagi."
            exit 0
          fi

          gh issue create --title "$JUDUL" --body "$(printf '%s\n' \
            "Penjaga kesegaran sumber (#80 B) menemukan dua sumber yang tak lagi sejalan." \
            "" \
            "- statistik IDX (ds_*.json): $DS" \
            "- harga (ohlc/BBCA.json): $HARGA" \
            "- selisih: $BEDA hari, yang tertinggal: $BASI" \
            "" \
            "Yang biasanya jadi sebabnya: panen sore tak berjalan (Task Scheduler menolak, token mati sebelum langkah IDX), atau PDF IDX belum terbit dan tak pernah disusul." \
            "" \
            "Issue ini dibuat otomatis dan tidak akan digandakan selama masih terbuka.")"
          echo "::error::$JUDUL"

      # #98 A — gudang broker tahunan vs harga.
      #
      # Johan 8 Sep 2026: "tadi saya cek di page whales data broker disana
      # tidak update". Yang basi bukan harga dan bukan penyaluran: gudang
      # tahunan tak ikut daftar commit bat panen, jadi selama belasan jam
      # Whales memajang broker 4 September di atas harga 7 September —
      # dua angka dari dua hari, di satu layar, tanpa satu pun galat.
      #
      # Tiga emiten, bukan satu: gudang dibangun per emiten, jadi satu
      # berkas yang kebetulan segar tak boleh mewakili 963 lainnya. Ketiganya
      # dipilih karena diperdagangkan tiap hari bursa — emiten sepi akan
      # tertinggal tanpa ada yang salah.
      - name: Bandingkan tanggal gudang broker dengan tanggal harga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          HARGA=$(python3 -c "import json;d=json.load(open('data-idx/json/ohlc/BBCA.json'));print(d['d'][-1][0])")
          TERTINGGAL=""
          for K in BBCA BBRI TLKM; do
            F="data-idx/json/broker_tahunan/$K/2026.json"
            [ -f "$F" ] || { TERTINGGAL="$TERTINGGAL $K(berkas tak ada)"; continue; }
            T=$(python3 -c "import json;d=json.load(open('$F'));h=d.get('hari') or {};print(max(h) if h else '')")
            echo "broker $K : ${T:-kosong}"
            if [ -z "$T" ] || [ "$T" \< "$HARGA" ]; then
              TERTINGGAL="$TERTINGGAL $K(${T:-kosong})"
            fi
          done
          echo "harga BBCA : $HARGA"

          if [ -z "$TERTINGGAL" ]; then
            echo "Gudang broker sejalan dengan harga."
            exit 0
          fi

          # Satu hari bursa masih wajar — gudang dibangun SESUDAH panen harga
          # di pipa yang sama, jadi jeda beberapa jam bukan kegagalan.
          BEDA=$(python3 -c "
          from datetime import date
          import json
          h = json.load(open('data-idx/json/broker_tahunan/BBCA/2026.json')).get('hari') or {}
          t = max(h) if h else '1990-01-01'
          print(abs((date.fromisoformat('$HARGA') - date.fromisoformat(t)).days))")
          if [ "$BEDA" -lt 2 ]; then
            echo "::warning::Gudang broker tertinggal $BEDA hari ($TERTINGGAL). Masih dalam ambang panen sore."
            exit 0
          fi

          JUDUL="Gudang broker tertinggal $BEDA hari dari harga ($HARGA)"
          ADA=$(gh issue list --state open --search "Gudang broker in:title" --json title --jq '[.[] | select(.title | startswith("Gudang broker"))] | length')
          if [ "$ADA" != "0" ]; then
            echo "::warning::$JUDUL — issue serupa sudah terbuka, tak dibuat lagi."
            exit 0
          fi

          gh issue create --title "$JUDUL" --body "$(printf '%s\n' \
            "Penjaga #98 A menemukan gudang broker tahunan tertinggal dari harga." \
            "" \
            "- harga (ohlc/BBCA.json): $HARGA" \
            "- gudang broker tertinggal:$TERTINGGAL" \
            "" \
            "Halaman yang membacanya (Whales Papan, Kuli Papan, Neo Papan, Berkas Emiten, Watchlist) akan memajang broker dari hari yang lebih tua daripada harganya, tanpa satu pun galat." \
            "" \
            "Yang biasanya jadi sebabnya: gudang tahunan tak ikut daftar commit bat panen, atau bangun_broker_tahunan.py gagal sesudah panen broker harian." \
            "" \
            "Issue ini dibuat otomatis dan tidak akan digandakan selama masih terbuka.")"
          echo "::error::$JUDUL"
