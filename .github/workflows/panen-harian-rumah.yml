# Rantai panen harian PENUH — runner rumahan.
#
# Kenapa berkas ini ada: sampai 20 Agustus 2026, DELAPAN pemanen tak masuk
# alur mana pun dan hanya jalan kalau ada yang mengetiknya —
# `panen_ohlc`, `panen_asing`, `sinkron_emiten`, `fetch_broker_summary`,
# `panen_seasonality`, `kartu_analisa`, `hitung_valuasi_historis`,
# `panen_keuangan_idx`. Akibatnya terlihat langsung di layar hari itu: IHSG
# sudah 20 Agustus sementara Kartu Analisa, Seasonality, dan Screener masih
# 19 Agustus — semuanya membaca OHLC yang belum dipanen. Bukan bug; memang
# tak pernah dijadwalkan.
#
# URUTANNYA MENGIKAT, dan bukan sekadar kerapian:
#
#   1. sinkron_emiten   -> `ListedShares` dari bursa. Jumlah saham dipakai
#                          SETIAP ruas per-saham; salah di sini menggeser
#                          q_eps/hist_eps/rev_ps/fcf_ps sekaligus.
#   2. panen_ohlc       -> dibaca Kartu, Screener, Watchlist, Bedah, chart,
#                          Seasonality. Selama ia tertinggal, semuanya
#                          tertinggal.
#   3. panen_asing      -> mayoritas dibangun dari arsip, nyaris nol jaringan.
#   4. turunan          -> kartu_analisa & hitung_valuasi_historis MEMBACA
#                          hasil 1-3. Menjalankannya lebih dulu menghasilkan
#                          angka kemarin yang terlihat segar.
#
# Yang SENGAJA tidak di sini:
#   * `panen_keuangan_idx` — kuartalan, bukan harian, dan sekali jalan bisa
#     ribuan permintaan. Tetap dipicu tangan.
#   * `panen_kabar` — punya jadwalnya sendiri (`panen-kabar-rumah.yml`).
#
# Runner rumahan, bukan awan: IDX menolak IP datacenter GitHub (terukur
# `update.yml` merah 13, 14, 17, 18, 19, 20 Agu) sementara dari rumah tembus
# sekali coba.

name: Panen harian penuh (runner rumahan)

on:
  schedule:
    # 18:30 WIB / 11:30 UTC (Johan 20 Agu 2026: "ganti jam 18.30") — sesudah
    # bursa tutup (16:15 WIB) dan sesudah `update-rumah.yml` sempat menarik PDF
    # statistiknya. Jam UTC-nya yang ditulis; WIB tetap UTC+7 sepanjang tahun,
    # jadi tak ada pergeseran musim yang perlu diurus.
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      lewati_ohlc:
        description: 'Lewati panen OHLC (dipakai kalau cuma mau menyegarkan turunannya)'
        type: boolean
        default: false

# Runner rumahan ini memakai konsol Windows ber-encoding lama, dan di sana satu
# tanda panah atau minus Unicode di pesan cetak MEMBUNUH skripnya sebelum ia
# bekerja. Terukur 5 Sep 2026: `panen_asing.py` mati di baris cetak pembukanya,
# jadi aliran asing berhenti berhari-hari sementara langkah berikutnya tetap
# hijau — datanya bahkan sudah ada di arsip, nol unduhan diperlukan. Satu
# variabel di sini menutup seluruh langkah Python sekaligus.
env:
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

concurrency:
  group: panen-harian
  cancel-in-progress: false

jobs:
  panen:
    runs-on: self-hosted
    # OHLC 960-an emiten memakan ±23 menit pada jalan penuh.
    timeout-minutes: 90
    defaults:
      run:
        # PowerShell, bukan bash — `shell: bash` di runner Windows menunjuk
        # bash WSL yang menolak LocalSystem, dan menyebut Git Bash dengan
        # jalur penuh ditolak runner karena mengandung spasi.
        # PowerShell + `-ExecutionPolicy Bypass` — bypass-nya WAJIB, bukan
        # kehati-hatian: sejak 18 Agu 2026 SETIAP langkah di runner rumahan
        # gagal `PSSecurityException: running scripts is disabled on this
        # system` (Execution Policy mesin = Restricted/AllSigned). Panennya
        # sendiri jalan, tapi langkah "Commit kalau ada perubahan" ikut gagal,
        # jadi hasil panen tak pernah masuk repo dan produksi membeku di 18
        # Agu tanpa satu pun galat yang terbaca dari halaman (Johan 21 Agu:
        # "beritanya bnyk yang basi nih, di github pun gak bisa jalan tuh").
        # Bypass di baris perintah hanya berlaku untuk proses itu — setelan
        # keamanan mesin TIDAK diubah.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - uses: actions/checkout@v4

      - name: Tentukan Python
        id: py
        run: |
          $kandidat = @('C:\Python314\python.exe', 'python3', 'python')
          foreach ($p in $kandidat) {
            $exe = (Get-Command $p -ErrorAction SilentlyContinue).Source
            if (-not $exe) { continue }
            & $exe -c "import curl_cffi" 2>$null
            if ($LASTEXITCODE -eq 0) {
              "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Host "Python: $exe"; exit 0
            }
          }
          Write-Host "::error::Tak ada Python yang punya curl_cffi."
          exit 1

      - name: 1 · Daftar emiten & jumlah saham
        continue-on-error: true
        run: |
          & "${{ steps.py.outputs.exe }}" scripts/sinkron_emiten.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::sinkron_emiten gagal" }

      - name: 2 · OHLC harian
        if: ${{ github.event.inputs.lewati_ohlc != 'true' }}
        continue-on-error: true
        run: |
          & "${{ steps.py.outputs.exe }}" scripts/panen_ohlc.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::panen_ohlc gagal" }

      - name: 3 · Aliran asing
        continue-on-error: true
        run: |
          & "${{ steps.py.outputs.exe }}" scripts/panen_asing.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::panen_asing gagal" }

      # `--tulis` WAJIB. Tanpa itu skripnya menghitung, mencetak "[383/383]",
      # keluar dengan kode SUKSES, dan tidak menyimpan apa pun — dari log,
      # jalan yang tak menyimpan terlihat persis seperti jalan yang berhasil.
      # Terjadi 20 Agu 2026.
      # Harga di `fundamental/*.json` ikut disegarkan TIAP HARI dari OHLC yang
      # baru saja dipanen — nol jaringan, 961 berkas dalam ~10 detik. Pemanen
      # penuh (`fetch_fundamental.py`, yfinance) tetap bulanan: ia butuh ~8
      # permintaan per emiten dan yang benar-benar berubah harian cuma harga.
      # Tanpa langkah ini, Stock Detail mencetak harga sebulan lalu di sebelah
      # label "diperbarui" yang terbaca seolah seluruh halaman segar (Johan
      # 22 Agu 2026: "data daily ini mah, harusnya update yaa setiap setelah
      # panen"). Wajib SESUDAH langkah 2 (OHLC) — sumbernya dari sana.
      - name: 3b · Segarkan harga fundamental (dari OHLC, nol jaringan)
        continue-on-error: true
        run: |
          & "${{ steps.py.outputs.exe }}" scripts/segarkan_harga_fundamental.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::segarkan_harga_fundamental gagal" }

      # DUA hal berbeda sama-sama disebut "broker summary", dan mencampurnya
      # membuat langkah ini absen berbulan-bulan:
      #   (a) LEVEL PASAR — 88 firm/hari dari `GetBrokerSummary`, otomatis
      #       penuh, nol manusia. Itu yang dipanen di sini.
      #   (b) PER EMITEN  — tak ada di endpoint publik mana pun (diuji ulang
      #       22 Agu 2026: `code`/`stockCode`/`kodeEmiten` DIABAIKAN, jawaban
      #       identik 88 baris). Itulah yang disetor kontributor lewat
      #       screenshot, dan itu memang menunggu manusia.
      # Komentar lama menempelkan sifat (b) ke skrip yang mengerjakan (a),
      # jadi ia sengaja dikecualikan dari panen harian — hasilnya berhenti di
      # 18 Agu 2026 tanpa satu pun galat.
      - name: 3c · Broker summary level pasar
        continue-on-error: true
        run: |
          & "${{ steps.py.outputs.exe }}" scripts/fetch_broker_summary.py --hari 5
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::fetch_broker_summary gagal" }

      # Broker summary PER EMITEN (Stockbit) — lapis yang tak ada di satu pun
      # endpoint IDX. Tokennya hidup di %USERPROFILE%\.papan\stockbit-token.json
      # (di LUAR checkout; runner dan sesi Claude memakai berkas yang SAMA supaya
      # refresh token tak diputar dua pihak lalu saling membatalkan). Access 24
      # jam, refresh 7 hari; `stockbit_token.py` memutarnya sendiri. Jalan
      # SESUDAH langkah 2 karena tanggal bawaannya = bar OHLC terakhir, dan cek
      # silangnya memakai Volume dari berkas yang sama.
      #
      # ENAM varian GROSS, bukan dua belas — Johan 5 Sep 2026: *"ralat dulu
      # setiap hari itu harusnya panen 6 varian karena gross, sedangkan yang
      # net bisa di hitung"*. Ini menggantikan ketetapan 23 Agu ("CI harus ke
      # lengkap Varian") yang memanen 12, dan menyelaraskan CI dengan bat
      # buka-laptop yang sudah 6 sejak 1 Sep.
      #
      # Susunannya: 3 papan (REGULER/NEGO/TUNAI) x 2 tipe investor
      # (ALL/FOREIGN), semuanya GROSS. Dua hal sengaja TIDAK dipanen karena
      # keduanya turunan eksak, bukan karena dianggap tak perlu:
      #   NET      = beli - jual dari GROSS (backtest 5.756 baris, 0 beda)
      #   DOMESTIC = ALL - FOREIGN
      # Halaman yang memajang "Net" menghitungnya di layar dari gross
      # (`tabelDuaSisi` di lib/dasbor/brokerEmiten.ts), tak satu pun pembaca
      # membuka berkas varian net-*. Diperiksa 5 Sep 2026 dengan grep, bukan
      # diingat.
      #
      # Beban turun separuh: 6 x ±960 = ±5.800 permintaan, pada jeda 0,4 detik
      # ≈ 40 menit (dulu 12 varian ≈ 1,3 jam). Balasan 429 sudah ditangani
      # skripnya: jeda 30 detik lalu coba sekali lagi.
      #
      # Berkas net-* yang TELANJUR ada di arsip dibiarkan sampai konsolidasi
      # (ketetapan J14) — berhenti memanennya bukan alasan menghapus yang
      # sudah terlanjur dibayar.
      - name: 3d · Broker summary per emiten (Stockbit, 6 varian GROSS)
        continue-on-error: true
        run: |
          & "${{ steps.py.outputs.exe }}" scripts/stockbit_token.py --status
          & "${{ steps.py.outputs.exe }}" scripts/panen_broker_harian.py --jeda 0.4 `
            --varian reguler,asing,nego,nego-asing,tunai,tunai-asing
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::panen_broker_harian gagal" }

      - name: 4 · Kartu Analisa
        continue-on-error: true
        run: |
          & "${{ steps.py.outputs.exe }}" scripts/riset/kartu_analisa.py --semua --tulis
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::kartu_analisa gagal" }
          # Peluang historis seluruh emiten. Yatim sampai 6 Sep 2026 -- nol
          # pemanggil di CI maupun bat, jadi angkanya membeku tanpa satu pun
          # galat. Membaca arsip harga yang sama dengan kartu_analisa.
          & "${{ steps.py.outputs.exe }}" scripts/bangun_prob.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::bangun_prob gagal" }

      # Kandidat Deep Dive dihitung SESUDAH kartu (butuh OHLC + asing yang
      # sudah segar). Keluarannya memandu setoran Broker Summary hari
      # berikutnya — Johan 22 Agu 2026: "sudah tau kandidat nya dulu dari
      # screener dan di analisa mendalam di buletin deepdive".
      - name: 4b · Kandidat Deep Dive
        continue-on-error: true
        run: |
          & "${{ steps.py.outputs.exe }}" scripts/riset/kandidat_deepdive.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::kandidat_deepdive gagal" }

      # Statistik RBS per kerangka + pemasok kandidat Deep Dive (#49). Chart
      # membaca `bt/rbs-stat-<TF>.json`; kerangka tanpa berkas tak menampilkan
      # angka sama sekali, jadi langkah ini yang menjaga angkanya hidup.
      - name: 4c · Statistik RBS & kandidat
        continue-on-error: true
        run: |
          & "${{ steps.py.outputs.exe }}" scripts/riset/rbs_statistik.py --kerangka D W M --tulis
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::rbs_statistik gagal" }
          # Statistik Gap: Node, bukan Python — skripnya MENGIMPOR mesin gap
          # yang sama dengan yang menggambar zonanya di layar.
          foreach ($tf in @("D","W","M")) {
            node app/scripts/gap-statistik.ts --tf=$tf --tulis
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::gap-statistik $tf gagal" }
          }

      # Rollup Top Broker lintas hari (#29) — dijumlah dari rekap broker
      # harian resmi yang sudah dibaca halaman itu, bukan sumber lain.
      - name: 4d · Rollup Top Broker rentang
        continue-on-error: true
        run: |
          & "${{ steps.py.outputs.exe }}" scripts/bangun_broker_rentang.py --tulis
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::bangun_broker_rentang gagal" }

      - name: 5 · Valuasi historis
        continue-on-error: true
        run: |
          if (Test-Path 'scripts/hitung_valuasi_historis.py') {
            & "${{ steps.py.outputs.exe }}" scripts/hitung_valuasi_historis.py
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::hitung_valuasi_historis gagal" }
          } else { Write-Host 'skrip valuasi historis tak ada — dilewati' }

      - name: 6 · Seasonality
        continue-on-error: true
        run: |
          if (Test-Path 'scripts/panen_seasonality.py') {
            & "${{ steps.py.outputs.exe }}" scripts/panen_seasonality.py
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::panen_seasonality gagal" }
          } else { Write-Host 'skrip seasonality tak ada — dilewati' }

      # HILIR Seasonality — langkah 6 di atas cuma memanen hulunya.
      # `siapkan_seasonality.py` yang mengubah hasil panen itu jadi berkas yang
      # BENAR-BENAR dibaca halaman, dan sampai 6 Sep 2026 ia tak dipanggil dari
      # MANA PUN: grep seluruh repo atas namanya hanya menemukan docstring-nya
      # sendiri. Akibatnya hulunya segar tiap hari sementara hilirnya terakhir
      # dibangun tangan 19 Agustus — segar di sumber, salah di layar, nol galat.
      # `bangun_ihsg_bulanan.py` jalan lebih dulu: keluarannya tinggal di
      # direktori seasonality yang sama dan dipakai sebagai pembanding.
      # Keduanya NOL JARINGAN — membaca berkas yang baru turun di langkah 6.
      - name: 6b · IHSG bulanan + berkas siap-unduh Seasonality
        continue-on-error: true
        run: |
          if (Test-Path 'scripts/bangun_ihsg_bulanan.py') {
            & "${{ steps.py.outputs.exe }}" scripts/bangun_ihsg_bulanan.py
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::bangun_ihsg_bulanan gagal" }
          } else { Write-Host '::warning::scripts/bangun_ihsg_bulanan.py tak ada — dilewati' }
          & "${{ steps.py.outputs.exe }}" scripts/siapkan_seasonality.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::siapkan_seasonality gagal" }

      # Hakim jejak + kohort terkunci. Ditambahkan 5 Sep 2026 atas permintaan
      # Johan: *"termasuk win rate kita yang kita cari belum selesai bahas itu
      # terakhir tanggal 2 september … win rate nya berapa, dan diterapin di
      # page mana"*.
      #
      # Sebelum ini seluruh rantai win rate HANYA hidup di bat buka-laptop —
      # kalau laptopnya tak dibuka, angka di Screener dan Kartu Analisa diam
      # tanpa satu pun galat. Dua skrip ini aman dijalankan dari dua tempat:
      # keduanya nol jaringan, membaca `ohlc/` dan `rekomendasi/` yang sudah
      # ada, dan keluarannya SEKALI TULIS — `penilaian/<tgl>.json` tak pernah
      # ditimpa, jadi menjalankannya dua kali tak mengubah apa pun.
      #
      # Yang SENGAJA tidak ikut ke sini: `rekap_preset.py` dan
      # `bangun-screener.mjs`. Keduanya MENULIS `rekomendasi/<tgl>.json`, dan
      # dua penulis di dua mesin untuk berkas sekali-tulis yang sama persis
      # bentuk masalah yang sudah dibayar di `ohlc/`. Kalau kelak rantai itu
      # perlu jalan tanpa laptop, pindahkan seluruhnya ke sini — bukan
      # dijalankan di dua tempat.
      - name: 7 · Hakim jejak (win rate) & kohort terkunci
        continue-on-error: true
        run: |
          & "${{ steps.py.outputs.exe }}" scripts/riset/nilai_jejak.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::nilai_jejak gagal" }
          & "${{ steps.py.outputs.exe }}" scripts/riset/selisih_terkunci.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::selisih_terkunci gagal" }

      # Vonis merah/hijau diputuskan DI SINI, satu tempat — bukan tersebar di
      # exit code tiap langkah. Tiap langkah di atas `continue-on-error` supaya
      # satu pemanen mati tak menghentikan yang lain; harganya, kegagalan jadi
      # tak terlihat kalau tak ada yang memeriksa HASILNYA. Langkah ini yang
      # memeriksa isi, bukan status langkah.
      #
      # Pemeriksanya skrip tersendiri, bukan here-string PowerShell di dalam
      # YAML: `'@` wajib di kolom 0 dan itu menabrak indentasi YAML — berkas
      # ini sempat ditolak parser karenanya.
      - name: Periksa kesegaran
        run: |
          & "${{ steps.py.outputs.exe }}" scripts/cek_kesegaran.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit kalau ada perubahan
        if: always()
        run: |
          $berkas = 'data-idx/json'
          git diff --quiet -- $berkas
          if ($LASTEXITCODE -eq 0) { Write-Host 'Tidak ada perubahan.'; exit 0 }
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $berkas
          $stempel = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          git commit -m "data: panen harian penuh $stempel UTC"
          git pull --rebase --autostash origin $env:GITHUB_REF_NAME
          git push origin "HEAD:$env:GITHUB_REF_NAME"

      # Runner rumahan tak memulai dari mesin bersih seperti runner GitHub.
      - name: Bersihkan sisa
        if: always()
        run: |
          git clean -fdq -- data-idx
          exit 0
