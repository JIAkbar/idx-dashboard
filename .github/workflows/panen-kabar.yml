# Panen kabar dari GitHub Actions — SEMUA sumber dicoba, hasilnya dilaporkan
# per sumber.
#
# Sampai 18 Agu 2026 berkas ini cuma memanen sebagian sumber karena "IDX 403
# dari IP datacenter". Alasan itu dibuat SEBELUM `scripts/idx_net.py` ada
# (curl_cffi, sidik jari TLS) dan menggantung tak teruji — sampai 28 Agu 2026.
#
# ## SUDAH DIUJI 28 Agu 2026 — asumsinya BENAR, dan ini vonis akhirnya
#
# Uji terkontrol: runner memang memasang curl_cffi (langkah `pip install`
# di bawah) dan `panen_kabar.py` memang merutekan URL IDX lewat `idx_net.get()`
# (impersonate chrome124) — jadi sidik jari TLS benar-benar terpakai di awan,
# bukan jatuh balik ke `requests`. Hasilnya, endpoint yang sama persis:
#
#   run awan  33155254283 (08:27 UTC) : IDX berita 0 [403] · pengumuman 0 [403] · Kontan 0 [403]
#   run rumah 33170740132 (12:22 UTC) : IDX berita 30 [ok] · pengumuman 30 [ok] · Kontan 25 [ok]
#   uji langsung dari mesin rumah, hari yang sama: HTTP 200
#
# **Blokirnya berbasis IP, bukan bentuk permintaan.** Permintaan identik
# ditolak dari runner GitHub dan diterima dari rumah, dan Kontan menunjukkan
# pola yang sama di host berbeda. Tak ada akal-akalan sisi klien yang akan
# mengubah itu.
#
# Konsekuensinya: pembagian awan/rumah di sini PERMANEN DAN DISENGAJA, bukan
# kekurangan yang menunggu diperbaiki. Jangan habiskan waktu mencoba menembus
# 403 dari awan lagi — pertanyaannya sudah dijawab dengan angka.
#
# Catatan sejarah yang tetap berlaku: log run 32139468436 menunjukkan job
# HIJAU dan commit terkirim padahal `IDX berita: 0 item` — satu sumber yang
# masih hidup cukup membuat panen terlihat sehat. Itu sebabnya berkas ini
# melapor PER SUMBER.
#
# Jadi sekarang: coba semuanya, laporkan apa adanya, dan biarkan hasilnya yang
# menjawab sumber mana yang tembus dari sini — pertanyaan yang mustahil dijawab
# dari mesin rumahan. Yang tembus dicatat di `data-idx/json/kabar-sumber-awan.json`;
# sumber yang PERNAH tembus lalu berhenti = job merah, sumber yang belum pernah
# tembus tidak, supaya alarmnya tidak merah selamanya dan berhenti dibaca.
#
# Aman dijalankan berdampingan dengan jalur rumahan: `panen_kabar.py` MENGGABUNG
# dengan isi berkas yang ada dan membuang duplikat — dua jalur tidak saling
# menimpa.

name: Panen kabar (semua sumber)

on:
  schedule:
    # Tiap 2 jam, SEPANJANG HARI, tiap hari (permintaan Johan 29 Agu 2026).
    #
    # Dulu dibatasi jendela 07:00–19:00 WIB Sen–Sab. Yang mengubahnya: runner
    # RUMAHAN ternyata kehilangan 5–6 panen terjadwal tiap hari laptop tutup
    # (26 Agu laptop menyala: 7 run; 27 Agu: 1 run) — jadwal yang dilewati
    # runner offline hilang DIAM-DIAM, tanpa jejak merah. Jalur awan yang
    # jalan 24 jam menutup lubang itu.
    #
    # Dua hal yang membuat ini aman, keduanya diperiksa sebelum diubah:
    # 1. TIDAK memicu alarm palsu. `cek_kabar.py` menghitung umur hanya dari
    #    jam yang jatuh di jendela 07:00–19:00 HARI BURSA (kalender dari
    #    `ds_*.json`), jadi run tengah malam atau Minggu yang tak membawa
    #    kabar baru tak menambah umur — vonis kesegarannya tak berubah.
    # 2. NOL ongkos. Repo ini publik, jadi menit Actions gratis tanpa batas.
    #
    # Sumber yang memang tembus dari awan (Google News, IPOT, snips) hidup di
    # luar jam bursa juga, jadi cakupan 24 jam masuk akal untuk mereka. Yang
    # tak tembus dari awan (IDX, Kontan) tetap tak tembus — itu blokir per-IP
    # yang sudah divonis permanen di komentar kepala berkas ini.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      sumber:
        description: >-
          Sumber kabar.json yang dipanen (pisahkan koma). Kosongkan untuk
          semuanya. Pilihan: idx, idx-pengumuman, ipot, kontan, google-news
        required: false
        default: ''

# Butuh menulis balik ke repo (hasil panen di-commit).
permissions:
  contents: write

concurrency:
  # Dua jalannya sekaligus akan berebut commit ke berkas yang sama.
  group: panen-kabar
  cancel-in-progress: false

env:
  # Catatan hasil per sumber, di LUAR repo — ini bahan laporan, bukan data.
  #
  # JANGAN diganti jadi `${{ runner.temp }}`. Konteks `runner` TIDAK tersedia
  # di `env` tingkat workflow (juga tidak di `env` tingkat job — hanya tingkat
  # step), dan memakainya membuat GitHub menolak SELURUH berkas sebelum satu
  # job pun dibuat: run 0 detik, nol job, nol log, cuma "This run likely failed
  # because of a workflow file issue". Terjadi 18–19 Agu 2026 — enam run merah
  # beruntun yang terbaca seperti panennya gagal, padahal panennya tak pernah
  # dijalankan sama sekali. YAML-nya sah; yang menolak validasi konteks
  # GitHub, jadi `yaml.safe_load` bersih tidak membuktikan apa pun.
  STATUS: /tmp/status-kabar.jsonl

jobs:
  panen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # curl_cffi WAJIB: `idx_net` memakainya untuk meniru sidik jari TLS
      # peramban. Tanpa itu dua sumber IDX mati 403 — dan sebelumnya baris ini
      # cuma memasang `requests`, jadi jalur awan tak pernah benar-benar
      # menguji jalur IDX yang sudah diperbaiki.
      - name: Pasang dependensi
        run: pip install --quiet requests curl_cffi

      # continue-on-error di kedua langkah panen: satu sumber (atau satu skrip)
      # mati tidak boleh menghentikan yang lain. Vonis merah/hijau diputuskan
      # SATU tempat, di langkah "Periksa" — bukan tersebar di exit code skrip.
      - name: Panen kabar.json
        continue-on-error: true
        run: >-
          python scripts/panen_kabar.py --batas 30 --status "$STATUS"
          ${{ github.event.inputs.sumber && format('--hanya "{0}"', github.event.inputs.sumber) || '' }}

      # Stockbit Snips: arsip 12 bulan di berkas terpisah (`snips.json`),
      # dipakai tab STOCKBIT SNIPS di halaman Kabar. `--hari` sengaja dibiarkan
      # bawaan 365 — angka itu juga jadi batas retensi, jadi memperkecilnya
      # untuk "menghemat" akan MEMOTONG arsip setahun yang sudah terkumpul.
      - name: Panen snips.json
        continue-on-error: true
        run: python scripts/panen_snips.py --status "$STATUS"

      # Menjawab dua pertanyaan sekaligus, ke $GITHUB_STEP_SUMMARY: apakah
      # panen barusan jalan (per sumber, dengan alasan gagalnya), dan apakah
      # ISI kabar.json masih segar (stempel waktu item terbaru per sumber —
      # bukan waktu berkas ditulis).
      - name: Periksa hasil & kesegaran
        id: cek
        continue-on-error: true
        run: python scripts/cek_kabar.py --status "$STATUS"

      # Commit tetap jalan walau vonisnya merah: data yang berhasil terpanen
      # tetap berguna, dan `kabar-sumber-awan.json` justru harus tersimpan
      # supaya jalan berikutnya tahu siapa yang pernah tembus.
      - name: Commit kalau ada perubahan
        if: always()
        run: |
          BERKAS="data-idx/json/kabar.json data-idx/json/snips.json data-idx/json/kabar-sumber-awan.json"
          if git diff --quiet -- $BERKAS; then
            echo "Tidak ada perubahan — tidak commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $BERKAS
          git commit -m "data: panen kabar $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Rebase dulu: jalur rumahan bisa saja mendorong commit lebih dulu.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Vonisnya di sini, sesudah commit, supaya job merah tidak ikut membuang
      # data yang sudah terpanen.
      - name: Merah kalau ada sumber yang bermasalah
        if: steps.cek.outcome == 'failure'
        run: |
          echo "::error::Ada sumber kabar yang gagal atau basi — lihat ringkasan di atas."
          exit 1
