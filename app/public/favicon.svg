<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tanda Papan: satu bilah papan bolak-balik (split-flap), mesin yang sama
       dengan papan IHSG di halaman Ringkasan. Garis jahitan mendatar di tengah
       itu ciri khasnya — tanpa garis itu ia cuma kotak berhuruf. -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#F0A62B"/>
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace"
        font-size="38" font-weight="700" fill="#131008">P</text>
  <rect x="4" y="31" width="56" height="2" fill="#131008" opacity="0.32"/>
</svg>
