<!-- PAPAN — "Kurung Ukur", edisi kedua (1 Sep 2026).

     PENERUS ikon pertama, bukan pengganti acak. Yang dipertahankan: empat
     siku pengukur mengepung bilah nilai — itu tanda pengenal PAPAN dan sudah
     dikenali di bilah tab. Yang berubah cuma satu hal, dan perubahannya
     bermakna.

     Di edisi pertama siku keempat sengaja PUDAR: bingkainya belum penuh, dan
     PAPAN mengatakannya. Sekarang keempat sikunya UTUH — bingkainya sudah
     tertutup — dan bilah nilainya jadi DUA: satu penuh, satu terbaca sebagian.
     Artinya bergeser dari "belum lengkap" ke "sudah berdiri, masih bertambah",
     dan itu keadaan yang jujur untuk PAPAN hari ini.

     Kejujuran ikon itu disengaja: ikon pertama tak berbohong saat produknya
     belum penuh, dan yang ini pun tak boleh berbohong dengan berpura-pura
     selesai. Bilah kedua yang lebih pendek itulah yang menjaganya.

     Garis 10 di viewBox 64 dipertahankan dari edisi pertama — di 16px, garis
     lebih tipis jatuh di bawah setengah piksel dan jadi abu-abu kotor.
     Warna ini juga dipakai di kepala PDF edisi (kertas terang); kembarannya
     untuk tab gelap ada di `favicon-gelap.svg`, geometrinya identik supaya
     ikon tak pernah "pindah" saat peramban berganti tema. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g fill="none" stroke="#16181a" stroke-width="10" stroke-linecap="square">
    <path d="M11 22V11H22"/>
    <path d="M42 11H53V22"/>
    <path d="M11 42V53H22"/>
    <path d="M42 53H53V42"/>
  </g>
  <rect x="20" y="26" width="24" height="7" fill="#7a5e00"/>
  <rect x="20" y="37" width="14" height="7" fill="#7a5e00" opacity=".45"/>
