<!-- PAPAN — "Kurung Ukur". Empat siku pengukur mengepung bilah nilai; siku
     keempat sengaja pudar: bingkainya belum penuh, dan PAPAN mengatakannya.
     Varian TEBAL (garis 10, siku pudar utuh tanpa dash) dipakai di semua
     ukuran favicon — dash di 16px jatuh di bawah setengah piksel dan jadi
     garis kotor berkedip, bukan "putus".
     Warna ini juga dipakai di kepala PDF edisi (kertas terang). -->
