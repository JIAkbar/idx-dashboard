<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Dua ikon, dipilih peramban menurut tema bilah tabnya. URUTAN WAJIB:
         bawaan dulu, yang bermedia SESUDAHNYA — peramban memakai deklarasi
         terakhir yang cocok, jadi membaliknya membuat versi gelap tak pernah
         menang. Geometri keduanya identik; cuma dua nilai warna yang beda,
         supaya ikonnya tak terlihat "pindah" saat tema berganti.
         `favicon.svg` (badan gelap) juga dipakai di kepala PDF edisi harian —
         satu artwork untuk tab terang dan kertas. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon-gelap.svg" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preview tautan saat PAPAN dibagikan (channel WhatsApp rilis, X,
         LinkedIn, atau di-paste ke chat mana pun). `og:image` WAJIB URL
         absolut — jalur relatif diabaikan DIAM-DIAM oleh ketiganya, dan
         gagalnya tak terlihat dari sini: tautannya cuma muncul sebagai kotak
         abu tanpa gambar di ponsel orang lain. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://papan-idx.vercel.app/" />
    <meta property="og:title" content="PAPAN — Pusat Analisa Pasar Nusantara" />
    <meta property="og:description" content="Angka Bursa Efek Indonesia yang bisa ditelusuri ke sumbernya." />
    <meta property="og:image" content="https://papan-idx.vercel.app/og-papan.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PAPAN — Pusat Analisa Pasar Nusantara" />
    <meta name="twitter:description" content="Angka Bursa Efek Indonesia yang bisa ditelusuri ke sumbernya." />
    <meta name="twitter:image" content="https://papan-idx.vercel.app/og-papan.png" />
    <title>PAPAN — Pusat Analisa Pasar Nusantara</title>
    <!-- Data hari-tersedia dipakai HAMPIR SEMUA halaman (useDataHarian) — mulai
         unduh sejak HTML dibaca, paralel dengan bundle JS, bukan menunggu JS
         selesai lalu baru fetch (rantai berurutan = lambat di jaringan pelan).
         fetch() di dataHarian.ts sengaja TANPA opsi mode/credentials khusus
         supaya cocok dengan preload ini (default keduanya sama). -->
    <!-- Plus Jakarta Sans (teks + display) + IBM Plex Mono disalin ke repo
         (public/fonts), bukan ditarik dari CDN Google/jsDelivr: pembaca PAPAN
         tak perlu mengirim permintaan ke server pihak ketiga, dan teks halaman
         tak menunggu CDN yang lambat atau diblokir. Dua berkas yang pasti
         terpakai di layar pertama di-preload; sisanya menyusul lewat CSS. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/PlusJakartaSans-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/PlusJakartaSans-700.woff2" />
    <link rel="stylesheet" href="/fonts/jakarta.css" />
    <!-- Preload `data-idx/json/index.json` DIBUANG 1 Sep 2026, dan sengaja
         tidak dikembalikan. Ia petunjuk statis: berangkat sebelum satu baris
         skrip pun jalan, jadi tak ada tempat di dalam kode aplikasi yang bisa
         mencegahnya — termasuk gerbang tutup sementara di `main.tsx`. Saat
         PAPAN ditutup untuk renovasi, halaman maintenance wajib nol permintaan
         data (ia satu-satunya yang tayang publik, jadi satu-satunya yang bisa
         membocorkan alamat sumber data), dan preload ini satu-satunya yang
         masih lolos.
         Ongkosnya: unduhan index.json mulai sesudah modulnya diurai, bukan
         sebelumnya. Preload FONT di atas dipertahankan — ia tak membocorkan
         apa pun dan menahan pergeseran teks di layar pertama. -->

    <!-- tv.js TradingView SENGAJA TIDAK dimuat di sini — cuma dipakai widget
         Chart Indeks (ChartIndeks.tsx), dimuat on-demand oleh
         TradingViewChart.tsx saat komponennya benar-benar dipasang. Halaman
         depan (dan hampir semua halaman lain) tidak pernah menyentuhnya. -->
    <!-- Tema dibaca SEBELUM React jalan. Tanpa ini halaman selalu terbit putih
         dulu (body di App.css dipatok terang) lalu berkedip gelap saat
         ThemeProvider mount — dan sejak rute dipecah jadi potongan terpisah,
         kedipan itu ikut muncul tiap menunggu potongan baru, bukan cuma saat
         muat pertama. Nilai & kunci sama persis dengan ThemeContext.tsx
         ('papan-tema', default 'dark'). -->
    <script>
      (function () {
        var t = 'dark';
        try {
          var s = localStorage.getItem('papan-tema');
          if (s === 'light' || s === 'dark') t = s;
          // Mode 'sistem' diterjemahkan DI SINI juga, bukan hanya di React:
          // kalau tidak, halaman terbit gelap dulu lalu berkedip terang begitu
          // React jalan — persis kedipan yang skrip ini ada untuk mencegahnya.
          else if (s === 'sistem') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) { /* private mode — pakai default */ }
        document.documentElement.dataset.tema = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
