<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAPAN — Pusat Analisa Pasar Nusantara</title>
    <!-- Data hari-tersedia dipakai HAMPIR SEMUA halaman (useDataHarian) — mulai
         unduh sejak HTML dibaca, paralel dengan bundle JS, bukan menunggu JS
         selesai lalu baru fetch (rantai berurutan = lambat di jaringan pelan).
         fetch() di dataHarian.ts sengaja TANPA opsi mode/credentials khusus
         supaya cocok dengan preload ini (default keduanya sama). -->
    <link rel="preload" as="fetch" crossorigin href="/data-idx/json/index.json" />
    <!-- tv.js TradingView SENGAJA TIDAK dimuat di sini — cuma dipakai widget
         Chart Indeks (ChartIndeks.tsx), dimuat on-demand oleh
         TradingViewChart.tsx saat komponennya benar-benar dipasang. Halaman
         depan (dan hampir semua halaman lain) tidak pernah menyentuhnya. -->
    <!-- Tema dibaca SEBELUM React jalan. Tanpa ini halaman selalu terbit putih
         dulu (body di App.css dipatok terang) lalu berkedip gelap saat
         ThemeProvider mount — dan sejak rute dipecah jadi potongan terpisah,
         kedipan itu ikut muncul tiap menunggu potongan baru, bukan cuma saat
         muat pertama. Nilai & kunci sama persis dengan ThemeContext.tsx
         ('papan-tema', default 'dark'). -->
    <script>
      (function () {
        var t = 'dark';
        try {
          var s = localStorage.getItem('papan-tema');
          if (s === 'light' || s === 'dark') t = s;
        } catch (e) { /* private mode — pakai default */ }
        document.documentElement.dataset.tema = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
