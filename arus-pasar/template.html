<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>{{JUDUL}}</title>
<style>
  :root{
    --ground:#0B1220; --panel:#111B2E; --panel2:#0E1726; --line:#1E2A40;
    --text:#E8EDF4; --dim:#8B98AC; --faint:#5A6878;
    --accent:#2DD4BF; --bull:#34D399; --bear:#F87171; --warn:#FBBF24;
  }
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{margin:0;padding:0;background:#000}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--text);line-height:1.5}

  .page{width:210mm;height:296mm;background:var(--ground);margin:0 auto;
    padding:14mm 15mm 10mm;position:relative;overflow:hidden;
    display:flex;flex-direction:column;page-break-after:always}
  @media screen{.page{margin:10px auto;box-shadow:0 10px 40px rgba(0,0,0,.6)}}
  @page{size:A4;margin:0}

  /* ── Masthead ── */
  .mast{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    border-bottom:2px solid var(--accent);padding-bottom:10px}
  .brand .eyebrow{font-size:8.5pt;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
  .brand h1{font-family:Georgia,Cambria,serif;font-size:21pt;font-weight:700;
    letter-spacing:.08em;margin:1px 0 0;line-height:1.05}
  .brand h1 .wave{color:var(--accent);letter-spacing:0}
  .edisi{text-align:right;font-size:8.5pt;color:var(--dim)}
  .edisi .kode{font-family:Consolas,monospace;color:var(--accent);font-size:9pt}

  /* ── Sampul ── */
  .cover{justify-content:center;align-items:center;text-align:center}
  .cover .wave-big{font-size:64pt;color:var(--accent);line-height:1}
  .cover h1{font-family:Georgia,Cambria,serif;font-size:40pt;letter-spacing:.12em;margin:8px 0 4px}
  .cover .sub{font-size:11pt;color:var(--dim);letter-spacing:.28em;text-transform:uppercase}
  .cover .tgl{margin-top:26px;font-size:12pt}
  .cover .kode{font-family:Consolas,monospace;color:var(--accent);font-size:10pt;margin-top:4px}
  .cover .isi{margin-top:34px;font-size:10.5pt;color:var(--dim);line-height:2}
  .cover .isi b{color:var(--text);font-weight:600}
  .cover .ihsg{margin-top:30px;font-size:9.5pt;color:var(--dim);
    border:1px solid var(--line);border-radius:4px;padding:8px 18px}
  .cover .disc{position:absolute;bottom:12mm;left:0;right:0;font-size:8pt;color:var(--faint)}

  /* ── Header emiten ── */
  .emiten{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:12px 0 8px}
  .emiten .tk{font-size:17pt;font-weight:700}
  .emiten .tk small{font-size:9.5pt;font-weight:400;color:var(--dim);margin-left:8px}
  .close{text-align:right;font-variant-numeric:tabular-nums}
  .close .harga{font-size:16pt;font-weight:700}
  .close .chg{font-size:9.5pt;font-weight:600}
  .close .chg.bull{color:var(--bull)} .close .chg.bear{color:var(--bear)}

  .chartwrap{background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:8px 8px 3px;position:relative}
  .chartwrap .cap{position:absolute;top:7px;left:10px;font-size:7pt;color:var(--faint);
    letter-spacing:.14em;text-transform:uppercase}
  canvas{width:100%;height:auto;display:block}

  .cols{display:grid;grid-template-columns:62mm 1fr;gap:5mm;margin-top:5mm;flex:1;min-height:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 11px}
  .ptitle{font-size:7.5pt;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    margin:0 0 7px;display:flex;justify-content:space-between}

  .meter{height:5px;border-radius:3px;margin:1px 0 3px;position:relative;
    background:linear-gradient(90deg,var(--bear),var(--faint) 50%,var(--bull))}
  .meter i{position:absolute;top:-3px;width:2.5px;height:11px;background:var(--accent);border-radius:2px}
  .meterlbl{display:flex;justify-content:space-between;font-size:6.5pt;color:var(--faint);
    text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}

  table.brk{width:100%;border-collapse:collapse;font-size:7.8pt;font-variant-numeric:tabular-nums}
  table.brk th{font-size:6.5pt;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;
    text-align:right;padding:2px 0;border-bottom:1px solid var(--line);font-weight:600}
  table.brk th:first-child{text-align:left}
  table.brk td{padding:2px 0;text-align:right}
  table.brk td:first-child{text-align:left;font-weight:700}
  .bcode-b{color:var(--bull)} .bcode-s{color:var(--bear)}
  .brk .sep td{padding:4px 0 2px;font-size:6.5pt;color:var(--faint);text-transform:uppercase;
    letter-spacing:.12em;text-align:left;font-weight:600;border-bottom:1px solid var(--line)}
  .tag{font-size:5.8pt;font-weight:600;border-radius:2px;padding:0 3px;margin-left:4px;vertical-align:1px}
  .tag.ritel{color:var(--warn);border:1px solid var(--warn)}
  .tag.scalp{color:var(--dim);border:1px solid var(--dim)}
  .brksrc{font-size:6.5pt;color:var(--faint);margin-top:6px}

  .bias{display:flex;justify-content:space-between;align-items:center;gap:8px;
    border-bottom:2px solid var(--line);padding-bottom:7px;margin-bottom:8px}
  .bias .lbl{font-size:11.5pt;font-weight:700}
  .bias .lbl b.bull{color:var(--bull)} .bias .lbl b.bear{color:var(--bear)}
  .risk{font-size:7.5pt;font-weight:700;letter-spacing:.14em;border-radius:3px;
    padding:2px 7px;text-transform:uppercase}
  .risk.MENENGAH{color:var(--accent);border:1px solid var(--accent)}
  .risk.TINGGI{color:var(--warn);border:1px solid var(--warn)}
  .risk.EKSTREM{color:var(--bear);border:1px solid var(--bear)}

  .sec{margin-bottom:8px}
  .sec h3{font-size:7.5pt;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 3px}
  .sec p{margin:0;font-size:8.8pt}
  .sec p.dim{color:var(--dim)}
  .flowline{font-size:8.8pt;font-weight:600}
  .flowline .net-b{color:var(--bull)} .flowline .net-s{color:var(--bear)}

  .sr{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:8.8pt;
    font-variant-numeric:tabular-nums;background:var(--panel2);border:1px solid var(--line);
    border-radius:4px;padding:7px 11px;margin:3px 0 8px}
  .sr .k{font-size:7pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;align-self:center}
  .sr .k.sup{color:var(--bull)} .sr .k.res{color:var(--bear)}
  .sr .v{font-weight:600}
  .sr .v span{color:var(--faint);font-weight:400;padding:0 3px}

  .strategi{background:var(--panel2);border-left:3px solid var(--accent);
    padding:6px 10px;font-size:9pt;font-weight:600;margin:3px 0 8px;border-radius:0 4px 4px 0}
  .invtar{display:flex;gap:16px;flex-wrap:wrap;font-size:8.8pt;margin-bottom:8px;
    font-variant-numeric:tabular-nums}
  .invtar .inv b{color:var(--bear)} .invtar .tar b{color:var(--text)}
  .konsek{font-size:8pt;color:var(--dim);border-top:1px dashed var(--line);padding-top:6px}
  .skorbar{display:flex;gap:10px;font-size:7.5pt;color:var(--dim);margin-top:auto;
    padding-top:6px;font-variant-numeric:tabular-nums}
  .skorbar b{color:var(--text)}

  .foot{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);
    margin-top:4mm;padding-top:7px;font-size:7pt;color:var(--faint)}
  .foot .kode{font-family:Consolas,monospace}

  /* ── Peringkat ── */
  .rank-kesimpulan{background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:10px 14px;margin:12px 0;font-size:9.5pt}
  .rank-kesimpulan h3{font-size:7.5pt;letter-spacing:.2em;text-transform:uppercase;
    color:var(--accent);margin:0 0 4px}
  table.rank{width:100%;border-collapse:collapse;font-size:9pt;font-variant-numeric:tabular-nums}
  table.rank th{font-size:7pt;color:var(--faint);text-transform:uppercase;letter-spacing:.12em;
    text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
  table.rank td{padding:7px 6px;border-bottom:1px solid var(--line)}
  table.rank .skor{font-weight:700;font-size:11pt}
  .blok{background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:9px 13px;margin-top:8px;font-size:8.5pt}
  .blok h3{font-size:7pt;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 3px}
  .blok.warn{border-left:3px solid var(--warn)}
  .blok .dim{color:var(--dim)}
</style>
</head>
<body>
<!--PAGES-->
<script>
const OHLC = /*OHLC*/{};
function gambarChart(id, tk, ema50, pivot){
  const cv=document.getElementById(id), x=cv.getContext('2d');
  const css=getComputedStyle(document.documentElement), C=n=>css.getPropertyValue(n).trim();
  const bars=OHLC[tk].slice(-65); // ~3 bulan: zona pivot tetap terbaca, tidak terkompres puncak lama
  const W=cv.width,H=cv.height,pad={t:20,r:110,b:14,l:8};
  const pvals=Object.values(pivot);
  const lo=Math.min(...bars.map(b=>b.l),...pvals)*0.985,
        hi=Math.max(...bars.map(b=>b.h),...pvals)*1.015;
  const X=i=>pad.l+i*(W-pad.l-pad.r)/(bars.length-1),
        Y=v=>pad.t+(hi-v)*(H-pad.t-pad.b)/(hi-lo);
  x.font="17px Segoe UI";
  // label anti-tumpuk: geser ke bawah bila jarak <19px dari label sebelumnya
  let yTerpakai=[];
  for(const [n,v] of Object.entries(pivot)){
    x.strokeStyle=n[0]==="R"?C('--bear'):n==="P"?C('--dim'):C('--bull');
    x.globalAlpha=.5;x.setLineDash([4,5]);x.beginPath();
    x.moveTo(pad.l,Y(v));x.lineTo(W-pad.r,Y(v));x.stroke();x.setLineDash([]);
    let yl=Y(v)+6;
    while(yTerpakai.some(u=>Math.abs(u-yl)<19)) yl+=19;
    yTerpakai.push(yl);
    x.globalAlpha=1;x.fillStyle=x.strokeStyle;
    x.fillText(n+" "+v.toLocaleString('id'),W-pad.r+6,yl);
  }
  const bw=Math.max(2.5,(W-pad.l-pad.r)/bars.length*.6);
  bars.forEach((b,i)=>{
    const up=b.c>=b.o;
    x.strokeStyle=x.fillStyle=up?C('--bull'):C('--bear');
    x.beginPath();x.moveTo(X(i),Y(b.h));x.lineTo(X(i),Y(b.l));x.stroke();
    x.fillRect(X(i)-bw/2,Y(Math.max(b.o,b.c)),bw,
      Math.max(1.5,Y(Math.min(b.o,b.c))-Y(Math.max(b.o,b.c))));
  });
  // EMA50 dihitung dari seri penuh supaya nilai awal jendela benar
  const all=OHLC[tk], k=2/51; let e=all[0].c;
  const emaSeri=all.map(b=>e=e+(b.c-e)*k);
  const emaBars=emaSeri.slice(-bars.length);
  x.strokeStyle=C('--accent');x.lineWidth=2.2;x.beginPath();
  emaBars.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(0),Y(v)));
  x.stroke();
}
/*DRAWCALLS*/
</script>
</body>
</html>
