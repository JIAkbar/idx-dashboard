<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>{{JUDUL}}</title>
<style>
  :root{
    --paper:#0E1620; --panel:rgba(255,255,255,.04); --ink:#E9EEF4; --ink2:#C4CFDA;
    --mute:#5E7080; --hair:rgba(255,255,255,.09); --brand:#12202C; --teal:#37B8AF;
    --bull:#2FBF71; --bull-dim:rgba(47,191,113,.14);
    --side:#E8A33D; --side-dim:rgba(232,163,61,.14);
    --bear:#E4574C; --bear-dim:rgba(228,87,76,.14);
    --warn:#E8A33D;
    --disp:"Bahnschrift","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Code","Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{margin:0;padding:0;background:#2A333D}
  body{font-family:var(--disp);color:var(--ink);line-height:1.45;font-size:9pt}
  .page{width:210mm;height:296mm;background:var(--paper);color:var(--ink);margin:0 auto;position:relative;
    display:flex;flex-direction:column;page-break-after:always;overflow:hidden}
  @media screen{.page{margin:10px auto;box-shadow:0 6px 30px rgba(0,0,0,.5)}}
  @page{size:A4;margin:0}

  /* ── Sistem sentimen: pita tepi kiri ── */
  .senti-edge{position:absolute;left:0;top:0;bottom:0;width:5px}
  .s-bull .senti-edge{background:var(--bull)}
  .s-side .senti-edge{background:var(--side)}
  .s-bear .senti-edge{background:var(--bear)}

  /* ── Pita masthead ── */
  .band{background:transparent;color:var(--ink);padding:7mm 14mm 5.5mm;
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--hair)}
  .band .m h1{font-family:Georgia,Cambria,serif;font-size:19pt;font-weight:700;
    margin:0;line-height:1;letter-spacing:.04em}
  .band .m .sub{font-size:7pt;letter-spacing:.24em;text-transform:uppercase;
    color:var(--mute);margin-top:2.5px}
  .band .m .byline{font-size:7pt;letter-spacing:.1em;color:var(--ink2);margin-top:3.5px}
  .band .e{text-align:right;font-size:7.5pt;color:var(--ink2);line-height:1.5}
  .band .e .kode{font-family:var(--mono);font-size:8pt;color:var(--teal)}

  .inner{padding:6mm 14mm 0;display:flex;flex-direction:column;flex:1;min-height:0}

  /* ── Judul emiten ── */
  .trow{display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--hair);padding-bottom:2mm}
  .trow .tk{font-family:var(--mono);font-size:19pt;font-weight:800;letter-spacing:-.01em;line-height:1}
  .trow .tk small{font-family:var(--disp);font-size:9pt;font-weight:400;color:var(--mute);margin-left:8px;letter-spacing:0}
  .trow .px{text-align:right;font-variant-numeric:tabular-nums;line-height:1.1;font-family:var(--mono)}
  .trow .px .h{font-size:19pt;font-weight:800}
  .trow .px .c{font-size:9pt;font-weight:700}
  .bull{color:var(--bull)} .bear{color:var(--bear)}
  /* chg% harga ikut TANDA (.bull/.bear dari build.py berdasar o.chg), BUKAN
     warna vonis — vonis bullish di hari merah tetap merah angkanya; sentimen
     sudah terwakili pita, pill, strategi, dan skor. */

  /* ── Strip statistik ── */
  .stats{display:flex;border-bottom:1px solid var(--hair);
    padding:2.2mm 0;font-variant-numeric:tabular-nums}
  .stats .s{flex:1;padding-right:8px}
  .stats .s .l{font-size:6.3pt;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .stats .s .v{font-size:9.5pt;font-weight:700;margin-top:1px}
  .stats .s .v small{font-size:7pt;font-weight:400;color:var(--mute)}

  /* ── Chart ── */
  .chartwrap{margin:3.5mm 0 0;position:relative;border:1px solid var(--hair);
    border-radius:1.5mm;padding:2mm 2.5mm;background:rgba(255,255,255,.02)}
  .chartwrap .cap{font-size:6.3pt;letter-spacing:.16em;text-transform:uppercase;
    color:var(--mute);margin-bottom:1.5mm}
  canvas{width:100%;height:auto;display:block}

  /* ── Kolom ── */
  .cols{display:grid;grid-template-columns:60mm 1fr;gap:7mm;margin-top:4mm;flex:1;min-height:0}

  h3.rule{font-size:7pt;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);
    margin:0 0 2mm;display:flex;align-items:center;gap:6px;font-weight:700}
  h3.rule::after{content:"";flex:1;border-top:1px solid var(--hair)}
  h3.rule .r{font-weight:400;color:var(--mute);letter-spacing:.06em}

  /* meter tipis */
  .meter{height:3px;background:linear-gradient(90deg,var(--bear),rgba(255,255,255,.16) 50%,var(--bull));
    position:relative;margin:1mm 0 1.5mm}
  .meter i{position:absolute;top:-2.5px;width:2px;height:8px;background:var(--ink)}
  .meterlbl{display:flex;justify-content:space-between;font-size:5.8pt;color:var(--mute);
    text-transform:uppercase;letter-spacing:.1em;margin-bottom:2.5mm}

  table.brk{width:100%;border-collapse:collapse;font-size:7.6pt;font-variant-numeric:tabular-nums;
    font-family:var(--mono)}
  table.brk th{font-size:6pt;color:var(--mute);text-transform:uppercase;letter-spacing:.12em;
    text-align:right;padding:1.5px 0 3px;border-bottom:1px solid var(--hair);font-weight:700}
  table.brk th:first-child{text-align:left}
  table.brk td{padding:2.1px 0;text-align:right;border-bottom:1px solid rgba(255,255,255,.045)}
  table.brk td:first-child{text-align:left;font-weight:700}
  .bcode-b{color:var(--bull)} .bcode-s{color:var(--bear)}
  .brk .sep td{padding:2.5mm 0 3px;font-size:6pt;color:var(--mute);text-transform:uppercase;
    letter-spacing:.12em;text-align:left;font-weight:700;border-bottom:1px solid var(--hair)}
  .brk .tot td{border-top:1px solid var(--hair);border-bottom:none;font-weight:700;padding-top:3px}
  .tag{font-size:5.4pt;font-weight:700;padding:0 2.5px;margin-left:3px;vertical-align:1px;
    letter-spacing:.05em;font-family:var(--disp)}
  .tag.ritel{color:var(--warn);outline:1px solid var(--warn)}
  .tag.scalp{color:var(--mute);outline:1px solid var(--mute)}
  .brksrc{font-size:6.2pt;color:var(--mute);margin-top:2mm;line-height:1.5;font-family:var(--disp)}

  /* ── Analisa kanan: verdict pill sentimen ── */
  .bias{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.5mm;
    padding:2mm 3mm;border-radius:1.5mm;background:var(--panel)}
  .bias .lbl{font-size:12.5pt;font-weight:800;letter-spacing:-.005em}
  .bias .lbl span{color:inherit}
  .s-bull .bias{background:var(--bull-dim);color:var(--bull)}
  .s-side .bias{background:var(--side-dim);color:var(--side)}
  .s-bear .bias{background:var(--bear-dim);color:var(--bear)}
  .risk{font-size:6.8pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    padding:1.5px 8px;border:1px solid currentColor;border-radius:99px}
  .risk.MENENGAH{color:var(--teal)}
  .risk.TINGGI{color:var(--warn)}
  .risk.EKSTREM{color:var(--bear)}
  .bias .risk{color:inherit}

  .sec{margin-bottom:3mm}
  .sec p{margin:0;font-size:8.6pt;color:var(--ink2)}
  .flowline{font-size:8.8pt;font-weight:700;color:var(--ink);margin-bottom:1px}
  .kw{font-weight:700}
  .s-bull .kw{color:var(--bull)}
  .s-side .kw{color:var(--side)}
  .s-bear .kw{color:var(--bear)}

  .sr{display:grid;grid-template-columns:auto 1fr;gap:1.5mm 5mm;font-size:9pt;
    font-variant-numeric:tabular-nums;border-top:1px solid var(--hair);
    border-bottom:1px solid var(--hair);padding:2.5mm 0;margin:0 0 3mm;font-family:var(--mono)}
  .sr .k{font-family:var(--disp);font-size:6.5pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;align-self:center}
  .sr .k.sup{color:var(--bull)} .sr .k.res{color:var(--bear)}
  .sr .v{font-weight:700}
  .sr .v span{color:var(--mute);font-weight:400;padding:0 4px}
  .sr .v .ragu{color:var(--warn);font-weight:400;font-size:7pt;font-family:var(--disp)}

  .strategi{border-left:3px solid var(--ink);padding:1.5mm 3mm 1.5mm 4mm;
    font-size:9.3pt;font-weight:700;margin-bottom:3mm}
  .s-bull .strategi{border-color:var(--bull);background:var(--bull-dim)}
  .s-side .strategi{border-color:var(--side);background:var(--side-dim)}
  .s-bear .strategi{border-color:var(--bear);background:var(--bear-dim)}
  .invtar{display:flex;gap:9mm;font-size:8.8pt;margin-bottom:3mm;font-variant-numeric:tabular-nums}
  .invtar .l{font-size:6.3pt;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:block}
  .invtar b{font-weight:700;font-family:var(--mono)}
  .invtar .inv b{color:var(--bear)}
  .invtar .tar b{color:var(--bull)}
  .konsek{font-size:8pt;color:var(--mute);margin:0}

  /* skor segmen — angka & bar ikut warna vonis */
  .skor{margin-top:auto;padding-top:3mm}
  .skor .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.5mm}
  .skor .head .t{font-size:6.5pt;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--ink2)}
  .skor .head .n{font-size:12pt;font-weight:800;font-variant-numeric:tabular-nums;font-family:var(--mono)}
  .s-bull .skor .head .n{color:var(--bull)}
  .s-side .skor .head .n{color:var(--side)}
  .s-bear .skor .head .n{color:var(--bear)}
  .skor .barrow{display:flex;gap:2px;height:5px}
  .skor .barrow i{background:var(--teal);border-radius:1px}
  .s-bull .skor .barrow i{background:var(--bull)}
  .s-side .skor .barrow i{background:var(--side)}
  .s-bear .skor .barrow i{background:var(--bear)}
  .skor .barrow i:nth-child(3){opacity:.8}
  .skor .barrow i:nth-child(5){opacity:.6}
  .skor .barrow i:nth-child(7){opacity:.45}
  .skor .barrow i:nth-child(9){opacity:.35}
  .skor .barrow i.sisa,.s-bull .skor .barrow i.sisa,.s-side .skor .barrow i.sisa,
  .s-bear .skor .barrow i.sisa{background:rgba(255,255,255,.08);opacity:1}
  .skor .leg{display:flex;gap:5mm;font-size:6.3pt;color:var(--mute);margin-top:1.5mm;
    font-variant-numeric:tabular-nums;font-family:var(--mono)}

  .foot{border-top:1px solid var(--hair);margin:3mm 14mm 0;padding:2mm 0 5mm;
    display:flex;justify-content:space-between;font-size:6.5pt;color:var(--mute)}
  .foot .kode{font-family:var(--mono)}

  /* ── Sampul (sistem sentimen) ── */
  .cover .wm-big{font-family:Georgia,Cambria,serif;font-size:46pt;font-weight:700;
    line-height:1.05;margin-top:8mm}
  .cover .cv-tag{font-size:8pt;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);margin-top:3mm}
  .cover .cv-tgl{font-size:13pt;margin-top:9mm;color:var(--ink2)}
  .cover .cv-kode{font-family:var(--mono);font-size:9pt;color:var(--teal);margin-top:2mm}
  .senti-sum{display:flex;gap:4mm;margin-top:11mm}
  .senti-sum .b{flex:1;border-radius:1.5mm;padding:4mm 5mm;font-family:var(--mono);
    font-variant-numeric:tabular-nums}
  .senti-sum .b .n{font-size:18pt;font-weight:800;display:block;line-height:1.15}
  .senti-sum .b .l{font-size:6.5pt;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
  .sb-bull{background:var(--bull-dim);color:var(--bull)}
  .sb-side{background:var(--side-dim);color:var(--side)}
  .sb-bear{background:var(--bear-dim);color:var(--bear)}
  .cv-list{margin-top:10mm}
  .cvrow{display:flex;align-items:center;gap:5mm;padding:3mm 0;border-bottom:1px solid var(--hair);
    font-variant-numeric:tabular-nums}
  .cvrow .dot{width:3mm;height:3mm;border-radius:1mm;flex:none}
  .cvrow .tkk{font-family:var(--mono);font-size:12pt;font-weight:800;width:24mm}
  .cvrow .lb{flex:1;color:var(--ink2);font-size:9.5pt}
  .cvrow .sk{font-family:var(--mono);font-size:12pt;font-weight:800}
  /* sampul padat 7-20 emiten: 2 kolom, label pendek */
  .cover .wm-big.kecil{font-size:30pt;line-height:1.1}
  .cv-list.padat{columns:2;column-gap:9mm;margin-top:7mm}
  .cv-list.padat .cvrow{padding:1.7mm 0;gap:3mm;break-inside:avoid}
  .cv-list.padat .tkk{font-size:10pt;width:17mm}
  .cv-list.padat .lb{font-size:7.3pt}
  .cv-list.padat .sk{font-size:10pt}
  .cv-foot{margin-top:auto;padding-bottom:14mm}
  /* kotak stat berlabel gaya sampul lama (V2) — angka besar kebaca, bukan
     satu baris kecil; label kecil di atas angka. */
  .cv-stats{display:flex;gap:10mm;background:rgba(255,255,255,.04);border:1px solid var(--hair);
    border-radius:2mm;padding:4mm 5mm;font-variant-numeric:tabular-nums;margin-bottom:4mm}
  .cv-stats .l{display:block;font-size:6.3pt;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:.8mm}
  .cv-stats b{font-family:var(--mono);font-size:10.5pt;color:var(--ink)}
  .cv-stats span .c-bull{font-family:var(--mono);font-size:9pt}
  .cv-foot .c-bull{color:var(--bull)}
  .cv-legal{font-size:7pt;color:var(--mute);line-height:1.8}

  /* ── Ringkasan (hal 1) ── */
  .lede{font-size:10.5pt;color:var(--ink2);margin:0 0 4mm;line-height:1.6;text-align:justify;text-wrap:pretty}
  table.ring{width:100%;border-collapse:collapse;font-size:8.8pt;font-variant-numeric:tabular-nums}
  table.ring th{font-size:6.3pt;color:var(--mute);text-transform:uppercase;letter-spacing:.14em;
    text-align:left;padding:2mm 3mm 1.5mm 0;border-bottom:1px solid var(--hair);font-weight:700}
  table.ring td{padding:2.6mm 3mm 2.6mm 0;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
  table.ring th:first-child,table.ring td:first-child{width:12mm;padding-right:4mm;
    color:var(--mute);font-family:var(--mono);font-size:8pt;text-align:left}
  table.ring .tk{font-weight:800;font-size:10pt;font-family:var(--mono)}
  table.ring .num{font-weight:700;font-family:var(--mono)}
  .pill{display:inline-block;font-family:var(--mono);font-size:7pt;font-weight:700;
    border-radius:1mm;padding:.6mm 2mm;letter-spacing:.04em}
  .pill.bull{background:var(--bull-dim);color:var(--bull)}
  .pill.side{background:var(--side-dim);color:var(--side)}
  .pill.bear{background:var(--bear-dim);color:var(--bear)}
  .c-bull{color:var(--bull)} .c-side{color:var(--side)} .c-bear{color:var(--bear)}
  .lbl-sisa{font-size:7.4pt;color:var(--mute)}
  .ihsgbar{background:var(--panel);border:1px solid var(--hair);border-radius:1.5mm;
    padding:3mm 4mm;font-size:8.6pt;margin:4.5mm 0;display:flex;gap:8mm;font-variant-numeric:tabular-nums}
  .ihsgbar b{font-weight:700;font-family:var(--mono)}
  .ihsgbar .l{font-size:6.3pt;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:block}
  .metode{font-size:7.6pt;color:var(--mute);line-height:1.7}
  /* baris EMA di bawah strip statistik */
  .emabar{font-family:var(--mono);font-size:7.2pt;color:var(--mute);margin:1.6mm 0 0;
    letter-spacing:.03em}
  .emabar b{color:var(--ink2);font-weight:700}
  .emabar .ket{font-size:6.4pt;letter-spacing:.02em}
  /* halaman kolofon (penutup) */
  .kolofon{display:flex;flex-direction:column;align-items:center;text-align:center;
    padding-top:34mm}
  .kf-monogram{width:20mm;height:20mm;background:#F0A62B;border-radius:2mm;
    display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;
    font-size:26pt;font-weight:700;color:#0E1620;margin-bottom:6mm}
  .kf-merek{font-size:8.5pt;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);
    margin-bottom:14mm}
  .kf-judul{font-family:Georgia,Cambria,serif;font-size:24pt;font-weight:700;color:var(--ink);
    margin:0 0 12mm}
  .kf-blok{margin-bottom:10mm}
  .kf-peran{font-size:8pt;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);
    margin-bottom:4mm}
  .kf-utama{font-family:Georgia,serif;font-size:17pt;color:var(--ink)}
  .kf-garis{border:0;border-top:1px solid var(--hair);width:44mm;margin:0 auto 10mm}
  .kf-grid{display:grid;grid-template-columns:repeat(2,62mm);gap:3.4mm 10mm;justify-content:center}
  .kf-nama{font-family:var(--mono);font-size:10.5pt;color:var(--ink2);padding:2.2mm 0;
    border-bottom:1px solid rgba(255,255,255,.05)}
  .kf-kaki{margin-top:auto;padding-top:14mm;font-size:7.5pt;color:var(--mute);line-height:1.9}
  .metode b{color:var(--ink2)}

  /* ── Kalimat angka (headline otomatis dari data) ── */
  .hangka{font-family:Georgia,Cambria,serif;font-size:13pt;font-weight:700;line-height:1.3;
    padding:2.5mm 0 2.2mm;border-bottom:1px solid var(--hair)}
  .hangka b{color:var(--teal);font-variant-numeric:tabular-nums}
  .hangka.em{font-size:9pt;font-weight:400;color:var(--ink2);padding:1.6mm 0 1.5mm;border-bottom:0}
  .hangka.em b{font-weight:700}

  /* ── Halaman Technical View IHSG ── */
  .blok4{display:grid;grid-template-columns:1fr 1fr;gap:4.5mm 8mm;margin-top:4.5mm}
  .blok4 .b4 p{margin:0;font-size:8.8pt;color:var(--ink2);line-height:1.6}
  .lvl{font-variant-numeric:tabular-nums}
  .lvl .r{display:flex;justify-content:space-between;padding:1.55mm 0;
    border-bottom:1px solid rgba(255,255,255,.05);font-size:8.6pt}
  .lvl .r .l{color:var(--mute);font-size:6.8pt;letter-spacing:.1em;text-transform:uppercase;align-self:center}
  .lvl .r b{font-family:var(--mono);font-weight:700}
  .b4.ksmp{border-left:3px solid var(--teal);padding-left:4mm}

  /* ── Halaman Sentimen Global & Domestik ── */
  .sent-head{display:flex;align-items:center;gap:8mm;margin:4mm 0 3.5mm;padding:4mm 5mm;
    background:var(--panel);border:1px solid var(--hair);border-radius:2mm}
  .sent-skor{font-family:var(--mono);font-size:28pt;font-weight:800;line-height:1;white-space:nowrap}
  .sent-skor small{font-size:10pt;color:var(--mute);font-weight:400}
  .sent-skor .l{display:block;font-family:var(--disp);font-size:6.3pt;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:1.5mm}
  .sent-bar{flex:1;display:flex;gap:1.2mm;height:5.5mm}
  .sent-bar i{flex:1;border-radius:.8mm;background:rgba(255,255,255,.08)}
  .sent-bar.c-bull i.isi{background:var(--bull)}
  .sent-bar.c-side i.isi{background:var(--side)}
  .sent-bar.c-bear i.isi{background:var(--bear)}
  .sent-komp{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
  .sent-komp .k{background:var(--panel);border:1px solid var(--hair);border-radius:1.5mm;padding:2.5mm 3mm}
  .sent-komp .k .l{font-size:6.3pt;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .sent-komp .k .v{font-family:var(--mono);font-size:10.5pt;font-weight:700;margin-top:1mm}
  .sent-komp .k .s{font-family:var(--mono);font-size:7.4pt;color:var(--mute);margin-top:.6mm}
  .formula{font-size:6.5pt;color:var(--mute);font-family:var(--mono);margin:2mm 0 4mm;line-height:1.7}
  .poin-grid{display:grid;grid-template-columns:1fr 1fr;gap:4.5mm 8mm;margin-top:2.5mm}
  .poin{display:grid;grid-template-columns:8mm 1fr;gap:3mm}
  .poin .no{font-family:Georgia,serif;font-size:15pt;font-weight:700;color:var(--teal);line-height:1}
  .poin h4{margin:0 0 1.2mm;font-size:9pt;font-weight:800;letter-spacing:.02em}
  .poin p{margin:0;font-size:8.3pt;color:var(--ink2);line-height:1.55}
  .sent-ksmp{margin-top:8mm;border:1px solid var(--teal);border-radius:2mm;padding:3mm 4mm}
  .sent-ksmp p{margin:0;font-size:8.8pt;color:var(--ink2);line-height:1.6}

  /* ── Scenario Map emiten: 3 kartu + aturan eksekusi ── */
  .skn{display:flex;flex-direction:column;gap:1.3mm;margin-bottom:2.5mm}
  .skn .kartu{border-left:2px solid var(--mute);border-radius:0 1mm 1mm 0;
    background:var(--panel);padding:1.1mm 2.5mm 1.3mm}
  .skn .kartu.b{border-color:var(--bull);background:var(--bull-dim)}
  .skn .kartu.t{border-color:var(--teal)}
  .skn .kartu.r{border-color:var(--bear);background:var(--bear-dim)}
  .skn .kt{font-size:6.4pt;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.7mm}
  .skn .kartu.b .kt{color:var(--bull)}
  .skn .kartu.t .kt{color:var(--teal)}
  .skn .kartu.r .kt{color:var(--bear)}
  .skn .kr{display:grid;grid-template-columns:11mm 1fr;gap:2.5mm;font-size:6.8pt;
    line-height:1.35;color:var(--ink2);font-variant-numeric:tabular-nums}
  .skn .kl{font-size:5.4pt;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding-top:.35mm}
  .skn .aturan{display:grid;grid-template-columns:11mm 1fr;gap:2.5mm;font-size:7.2pt;font-weight:700;
    padding:1.2mm 2.5mm;border:1px solid var(--hair);border-radius:1mm}
  .skn .aturan .kl{font-weight:400}

  /* ── Peringkat ── */
  table.rank{width:100%;border-collapse:collapse;font-size:8.8pt;font-variant-numeric:tabular-nums}
  table.rank th{font-size:6.3pt;color:var(--mute);text-transform:uppercase;letter-spacing:.14em;
    text-align:right;padding:2mm 0 1.5mm;border-bottom:1px solid var(--hair);font-weight:700}
  table.rank th:nth-child(-n+2){text-align:left}
  table.rank td{padding:2.8mm 0;border-bottom:1px solid rgba(255,255,255,.05);text-align:right}
  table.rank td:nth-child(-n+2){text-align:left}
  table.rank .tk{font-weight:800;font-size:10pt;font-family:var(--mono)}
  table.rank .total{font-weight:800;font-size:12pt;font-family:var(--mono)}
  .blok{margin-top:4.5mm}
  .blok p{margin:0;font-size:8.6pt;color:var(--ink2)}
  .blok.integritas{border-left:3px solid var(--warn);padding-left:4mm}
  .blok.integritas p{color:var(--mute);font-size:8pt}
</style>
</head>
<body>
<!--PAGES-->
<script>
const OHLC = /*OHLC*/{};
// EMA: [periode, warna, tebal] — dipilih kontras di #0E1620 tanpa norak
const EMAS=[[20,"#6FE3D9",1],[50,"#37B8AF",1],[60,"#7E97B8",1],[100,"#A583D6",1],[200,"#E0955A",1.5]];
function gambarChart(id, tk, ema50, pivot, nBar){
  const cv=document.getElementById(id), x=cv.getContext('2d');
  const all=OHLC[tk], bars=all.slice(-(nBar||252));
  const adaVol=all.some(b=>b.v>0); // JKSE: volume 0 semua -> panel volume dilewati
  const W=cv.width,H=cv.height,pad={t:30,r:136,b:14,l:6};
  const volH=adaVol?Math.round(H*.20):0, gap=adaVol?10:0;
  const pBot=H-pad.b-volH-gap; // batas bawah area harga; di bawahnya panel volume
  // EMA dihitung dari riwayat penuh (~2 thn, pemanasan EMA200), digambar 252 bar
  const seriEma=EMAS.map(([n])=>{const k=2/(n+1);let e=all[0].c;
    return all.map(b=>e=e+(b.c-e)*k).slice(-bars.length);});
  const pvals=Object.values(pivot);
  const lo=Math.min(...bars.map(b=>b.l),...pvals,...seriEma.map(s=>Math.min(...s)))*0.99,
        hi=Math.max(...bars.map(b=>b.h),...pvals,...seriEma.map(s=>Math.max(...s)))*1.01;
  const X=i=>pad.l+i*(W-pad.l-pad.r)/(bars.length-1),
        Y=v=>pad.t+(hi-v)*(pBot-pad.t)/(hi-lo);
  // legenda satu baris pojok kiri atas
  x.font="13px Cascadia Code, Consolas, monospace";x.textBaseline="middle";
  let lx=pad.l+2;
  for(const [n,c,w] of EMAS){
    x.strokeStyle=c;x.lineWidth=2.5;x.beginPath();x.moveTo(lx,11);x.lineTo(lx+13,11);x.stroke();
    lx+=17;x.fillStyle="rgba(233,238,244,.72)";x.fillText("EMA "+n,lx,11);
    lx+=x.measureText("EMA "+n).width+13;
  }
  x.textBaseline="alphabetic";x.font="15px Bahnschrift, Segoe UI";
  let yT=[];
  // label diurut nilai desc supaya tumpukan anti-tabrakan tetap berurut harga
  // (tanpa ini R1 bisa terdorong ke bawah P dan urutan kebaca acak)
  for(const [n,v] of Object.entries(pivot).sort((a,b)=>b[1]-a[1])){
    x.strokeStyle="rgba(255,255,255,.28)";x.lineWidth=1;x.setLineDash([3,4]);x.beginPath();
    x.moveTo(pad.l,Y(v));x.lineTo(W-pad.r,Y(v));x.stroke();x.setLineDash([]);
    let yl=Y(v)+5; while(yT.some(u=>Math.abs(u-yl)<17)) yl+=17; yT.push(yl);
    x.fillStyle="rgba(255,255,255,.72)";
    x.fillText(n+" "+v.toLocaleString('id'),W-pad.r+14,yl);
  }
  const bw=Math.max(3,(W-pad.l-pad.r)/bars.length*.62);
  x.lineWidth=1;
  bars.forEach((b,i)=>{
    const up=b.c>=b.o;
    x.strokeStyle=x.fillStyle=up?"#2FBF71":"#E4574C";
    x.beginPath();x.moveTo(X(i),Y(b.h));x.lineTo(X(i),Y(b.l));x.stroke();
    x.fillRect(X(i)-bw/2,Y(Math.max(b.o,b.c)),bw,
      Math.max(1.5,Y(Math.min(b.o,b.c))-Y(Math.max(b.o,b.c))));
  });
  seriEma.forEach((seri,j)=>{
    x.strokeStyle=EMAS[j][1];x.lineWidth=EMAS[j][2];x.beginPath();
    seri.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(0),Y(v)));
    x.stroke();
  });
  // ── panel volume: bar ikut arah candle (redup), lonjakan >1.75× MA20 penuh ──
  if(adaVol){
  const vAll=all.map(b=>b.v), maAll=[]; let s=0;
  vAll.forEach((v,i)=>{s+=v; if(i>=20)s-=vAll[i-20]; maAll.push(i>=19?s/20:null);});
  const vol=vAll.slice(-bars.length), vma=maAll.slice(-bars.length);
  const maxV=Math.max(...vol,...vma.map(v=>v||0))*1.05||1;
  const vY=v=>H-pad.b-v/maxV*volH;
  bars.forEach((b,i)=>{
    const up=b.c>=b.o, lonjak=vma[i]&&vol[i]>1.75*vma[i];
    x.fillStyle=up?(lonjak?"#2FBF71":"rgba(47,191,113,.32)")
                 :(lonjak?"#E4574C":"rgba(228,87,76,.32)");
    x.fillRect(X(i)-bw/2,vY(vol[i]),bw,Math.max(1,H-pad.b-vY(vol[i])));
  });
  x.strokeStyle="rgba(233,238,244,.55)";x.lineWidth=1;x.beginPath();
  vma.forEach((v,i)=>{if(v==null)return;
    i&&vma[i-1]!=null?x.lineTo(X(i),vY(v)):x.moveTo(X(i),vY(v));});
  x.stroke();
  // 1 tick sumbu volume, angka bulat gaya Indonesia (12,5 Jt)
  const fmtVol=v=>{const f=n=>n.toLocaleString('id',{maximumFractionDigits:1});
    return v>=1e9?f(v/1e9)+" M":v>=1e6?f(v/1e6)+" Jt":f(v/1e3)+" rb";};
  const mag=Math.pow(10,Math.floor(Math.log10(maxV*.8)));
  const tick=Math.floor(maxV*.8/mag)*mag;
  x.strokeStyle="rgba(255,255,255,.14)";x.setLineDash([3,4]);x.beginPath();
  x.moveTo(pad.l,vY(tick));x.lineTo(W-pad.r,vY(tick));x.stroke();x.setLineDash([]);
  x.fillStyle="rgba(255,255,255,.45)";x.font="12px Cascadia Code, Consolas, monospace";
  // ikut tumpukan anti-tabrakan label pivot (S3 bisa terdorong sampai zona volume)
  let vl=vY(tick)+4; while(yT.some(u=>Math.abs(u-vl)<15)) vl+=15;
  x.fillText(fmtVol(tick),W-pad.r+14,Math.min(vl,H-4));
  }
}
/*DRAWCALLS*/
window.__chartsDone = true;
</script>
</body>
